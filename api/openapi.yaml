openapi: 3.0.3
info:
  title: Maiak API
  version: 0.3.0
  description: |
    REST API of Maiak, the multi-tenant uptime-monitoring service. This file is the source of
    truth: the Go server and the TypeScript client are generated from it (ADR-0008).

    Authentication is a server-side session in the HttpOnly cookie `maiak_session`. Unsafe
    methods (POST, PUT, PATCH, DELETE) on authenticated endpoints also need the header
    `X-CSRF-Token` with the `csrf_token` returned by login, registration and
    `GET /api/v1/auth/me`; a missing or wrong token is answered with 403. Only health, the public
    config, login, registration and the heartbeat ping work without a session.

    Errors are `application/problem+json` (RFC 9457). A request that does not match this
    contract (malformed JSON, wrong types, unknown or missing fields) gets 400; a well-formed
    request that breaks a business rule (for example a URL with a private IP literal) gets 422.
    Both carry `fieldErrors` when the problem can be attributed to request body fields.

    Field names of the monitor, check, incident and settings resources are camelCase. The auth
    resources predate that convention and keep their snake_case names (ADR-0017).
  contact:
    name: Maiak maintainers
    url: https://github.com/theechofive/maiak
servers:
  - url: https://maiak.klr-ops.net
    description: Internal deployment on klr-platform (same origin as the web app)
tags:
  - name: system
    description: Service metadata
  - name: auth
    description: Login, logout and the current session
  - name: monitors
    description: HTTPS and heartbeat (watchdog) monitors, their status, statistics, checks and incidents
  - name: heartbeat
    description: The public ping endpoint of heartbeat monitors
  - name: settings
    description: Tenant settings such as the Slack webhook
  - name: plan
    description: The tenant's plan, its limits and the current usage
security:
  - cookieAuth: []
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Service health and build info
      description: Public liveness information for humans and simple checks. Does not touch the database.
      tags: [system]
      security: []
      responses:
        "200":
          description: The api process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/public/config:
    get:
      operationId: getPublicConfig
      summary: Settings the web app needs before login
      description: Public, needs no session. Tells the web app whether to offer registration.
      tags: [system]
      security: []
      responses:
        "200":
          description: The public configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConfig"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Log in with login and password
      description: |
        Creates a session and sets the `maiak_session` cookie. The login is an email address or
        the system login (`admin`), case-insensitive (normalised to lowercase); the session is
        bound to the user's tenant. Failures always return the same generic error. Attempts are
        rate limited per client IP and per normalised login. Like registration, it needs no CSRF
        token (there is no session yet).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          headers:
            Set-Cookie:
              description: The session cookie (`maiak_session`, HttpOnly, SameSite=Lax)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Register a new account and workspace
      description: |
        Self-service registration (ADR-0092). Creates a tenant on the `free` plan, the user as its
        `owner` and a session, sets the `maiak_session` cookie and answers like login (the user is
        logged in). There is no email verification and no email is sent.

        The email is trimmed and lowercased; it must be 3-254 characters of `a-z 0-9 . _ + - @`
        (the characters a login may contain) with one `@`, a non-empty local part and a domain
        with a dot. The password must be 12-128 characters (Unicode code points) and differ from
        the email; there are no composition rules. Policy failures are 422 with `fieldErrors`.

        An email that is already registered is answered with 409 `urn:maiak:problem:email-taken`:
        without verification, registration cannot hide whether an account exists. When
        registration is turned off (`MAIAK_REGISTRATION_ENABLED=false`) the answer is 403
        `urn:maiak:problem:registration-disabled`. Every attempt that reaches the password hash
        counts against the per-client-IP limit of the login, and hashing shares the login's
        bounded queue (429 with Retry-After). No CSRF token is needed (there is no session yet).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered and logged in
          headers:
            Set-Cookie:
              description: The session cookie (`maiak_session`, HttpOnly, SameSite=Lax)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Registration is turned off (`urn:maiak:problem:registration-disabled`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The email is already registered (`urn:maiak:problem:email-taken`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Log out
      description: Deletes the current session and clears the cookie.
      tags: [auth]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Logged out
          headers:
            Set-Cookie:
              description: Expires the session cookie
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/me:
    get:
      operationId: getMe
      summary: Current user and session
      description: Returns the logged-in user, the tenant of the session and the CSRF token.
      tags: [auth]
      responses:
        "200":
          description: The current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/monitors:
    get:
      operationId: listMonitors
      summary: List monitors with their current status
      description: |
        All monitors of the tenant that are not deleted, with the current status and summary
        counts. Answered from the state tables and rollups, never by scanning raw results.
      tags: [monitors]
      responses:
        "200":
          description: The monitors of the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createMonitor
      summary: Create a monitor
      description: |
        Creates an HTTPS monitor (`type` `http`, the default) or a heartbeat monitor (`type`
        `heartbeat`). An HTTPS monitor needs `url`; it starts with status `unknown` and is first
        checked within about 30 seconds. A heartbeat takes `expectedIntervalSeconds` and
        `graceSeconds` instead and must not send `url` or `expectedStatus` (422);
        `intervalSeconds`, `timeoutSeconds` and `failureThreshold` are ignored (one missed deadline
        is down). The
        response of a heartbeat carries `heartbeatUrl`, the secret ping URL, which is shown only
        here and by `POST /api/v1/monitors/{monitorId}/heartbeat-token`. A heartbeat stays
        `unknown` until its first ping (then `up`) or until its first deadline passes (then
        `down`).

        Fails with 409 `urn:maiak:problem:plan-limit-reached` (`limit` is `monitors` or
        `heartbeats`) when the tenant already has as many monitors of that type as its plan allows
        (deleted monitors do not count, see `GET /api/v1/usage`), and with 503 when the probe
        location that runs new monitors is unavailable.
      tags: [monitors]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitorCreate"
      responses:
        "201":
          description: The created monitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/PlanLimitReached"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/monitors/{monitorId}:
    parameters:
      - $ref: "#/components/parameters/MonitorId"
    get:
      operationId: getMonitor
      summary: One monitor with status and uptime
      description: The monitor with its current status, TLS expiry, ongoing incident and uptime for 24 h, 7 d and 30 d.
      tags: [monitors]
      responses:
        "200":
          description: The monitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMonitor
      summary: Edit a monitor
      description: |
        Changes the given fields. `intervalSeconds` and `timeoutSeconds` cannot be changed in the
        MVP: sending them with a different value fails with 422. A heartbeat may change `name`,
        `expectedIntervalSeconds`, `graceSeconds` and `notifySlack` (its deadline follows the new
        values); `failureThreshold` is ignored and the http fields fail with 422, as do the
        heartbeat fields on an http monitor.
      tags: [monitors]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitorUpdate"
      responses:
        "200":
          description: The updated monitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteMonitor
      summary: Delete a monitor
      description: |
        Soft delete: the monitor stops being checked, an open incident is resolved without a
        notification, history is kept until retention and the monitor no longer counts toward
        the limit.
      tags: [monitors]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/monitors/{monitorId}/pause:
    parameters:
      - $ref: "#/components/parameters/MonitorId"
    post:
      operationId: pauseMonitor
      summary: Pause a monitor
      description: Stops checking. An open incident is resolved without a notification. Idempotent.
      tags: [monitors]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The paused monitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/monitors/{monitorId}/resume:
    parameters:
      - $ref: "#/components/parameters/MonitorId"
    post:
      operationId: resumeMonitor
      summary: Resume a paused monitor
      description: Starts checking again within about 30 seconds; the status is `unknown` until the first check. Idempotent.
      tags: [monitors]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The resumed monitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/monitors/{monitorId}/heartbeat-token:
    parameters:
      - $ref: "#/components/parameters/MonitorId"
    post:
      operationId: regenerateHeartbeatToken
      summary: Give a heartbeat a new ping URL
      description: |
        Replaces the token of a heartbeat monitor. The old URL stops working immediately (it is
        answered like any unknown token) and the new one is returned once: only a hash is stored,
        so the server cannot show it again. Fails with 409 `urn:maiak:problem:not-a-heartbeat`
        for an HTTPS monitor.
      tags: [monitors]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The new ping URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/heartbeat/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: The secret token of the heartbeat's URL. Any value is accepted here; an unknown one gets 404.
        schema:
          type: string
    get:
      operationId: pingHeartbeat
      summary: Ping a heartbeat monitor
      description: |
        Public on purpose (ADR-0094): Alertmanager's webhook receiver and cron jobs call it without
        a session and without a CSRF token; the token in the URL is the credential. Records a ping
        and answers 204. A paused or deleted heartbeat also gets 204 but nothing is recorded. Any
        unknown token gets the same 404 problem. At most one ping per second per token is
        accepted, and unknown tokens are rate limited per client IP; excess requests get 429.
      tags: [heartbeat]
      security: []
      responses:
        "204":
          description: The ping was accepted
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: pingHeartbeatPost
      summary: Ping a heartbeat monitor (POST)
      description: |
        The same as the GET, for senders that can only POST (Alertmanager's webhook receiver). The
        body is ignored (at most 64 KiB is read).
      tags: [heartbeat]
      security: []
      responses:
        "204":
          description: The ping was accepted
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/monitors/{monitorId}/stats:
    parameters:
      - $ref: "#/components/parameters/MonitorId"
    get:
      operationId: getMonitorStats
      summary: Response time statistics
      description: |
        Average and p95 response time and the latency series for the range. Latency statistics
        cover checks that got a response. `24h` is computed from raw results (exact p95) in
        15-minute buckets; `7d` (hourly buckets) and `30d` (6-hour buckets) from hourly rollups,
        where p95 is the upper edge of the histogram bucket that contains the 95th percentile
        (edges 10, 25, 50, 100, 250, 500, 1000, 2500, 5000, 10000 ms). Every bucket of the range is
        listed; buckets without checks have null values.
      tags: [monitors]
      parameters:
        - name: range
          in: query
          required: false
          description: Time range ending now
          schema:
            $ref: "#/components/schemas/StatsRange"
      responses:
        "200":
          description: Statistics for the range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorStats"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/monitors/{monitorId}/checks:
    parameters:
      - $ref: "#/components/parameters/MonitorId"
    get:
      operationId: listMonitorChecks
      summary: Recent checks
      description: The most recent check results of the monitor, newest first.
      tags: [monitors]
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of checks to return
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Recent checks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/monitors/{monitorId}/incidents:
    parameters:
      - $ref: "#/components/parameters/MonitorId"
    get:
      operationId: listMonitorIncidents
      summary: Incidents of a monitor
      description: Incidents of the monitor, newest first, at most 100.
      tags: [monitors]
      responses:
        "200":
          description: Incidents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/settings/slack:
    get:
      operationId: getSlackSettings
      summary: Slack notification settings
      description: Whether a Slack webhook is configured. The webhook URL is a secret and is never returned.
      tags: [settings]
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlackSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: putSlackSettings
      summary: Set the Slack webhook
      description: |
        Stores the Incoming Webhook URL encrypted. It must match
        `https://hooks.slack.com/services/...` (422 otherwise). Replacing the URL of the existing
        channel is always allowed; creating the channel fails with 409
        `urn:maiak:problem:plan-limit-reached` (`limit` is `channels`) when the tenant already has
        as many notification channels as its plan allows.
      tags: [settings]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlackSettingsUpdate"
      responses:
        "200":
          description: Settings after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlackSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/PlanLimitReached"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/usage:
    get:
      operationId: getUsage
      summary: Plan, limits and usage
      description: |
        The tenant's plan, its effective limits (the plan's limits with per-tenant overrides
        applied) and the current usage. Deleted monitors do not count.
      tags: [plan]
      responses:
        "200":
          description: Plan, limits and usage of the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/settings/slack/test:
    post:
      operationId: testSlack
      summary: Send a Slack test message
      description: Sends a test message to the configured webhook. Fails with 409 when no webhook is configured, 429 when called again within 5 seconds for the same tenant or when Slack rate-limits the webhook (both with Retry-After), and 502 when Slack does not accept the message (Slack's answer is never returned).
      tags: [settings]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Slack accepted the message
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: maiak_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    MonitorId:
      name: monitorId
      in: path
      required: true
      description: Monitor id; a value that is not a UUID is answered with 400
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: The `csrf_token` of the session (from login or `GET /api/v1/auth/me`)
      schema:
        type: string
        minLength: 1
        maxLength: 256
  responses:
    BadRequest:
      description: The request does not match the contract
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Not logged in, or the credentials are invalid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Missing or invalid CSRF token, or not allowed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource does not exist in this tenant (or was deleted)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request conflicts with the current state (for example Slack is not configured)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PlanLimitReached:
      description: |
        The tenant's plan does not allow one more of this resource: `type` is
        `urn:maiak:problem:plan-limit-reached`, with the extension members `limit` and `max`
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:maiak:problem:plan-limit-reached
            title: Plan limit reached
            status: 409
            detail: The Free plan allows at most 3 monitors.
            limit: monitors
            max: 3
    UnprocessableEntity:
      description: The request is well-formed but breaks a validation rule; see `fieldErrors`
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until a new attempt may succeed
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: A dependency of the operation is temporarily unavailable; retry later
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Error:
      description: Unexpected error (also 501 for operations that are not implemented yet)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, version, commit]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          example: 1a2b3c4
        commit:
          type: string
          example: 1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login:
          type: string
          description: An email address or the system login (the default admin is `admin`), case-insensitive
          minLength: 1
          maxLength: 254
          pattern: "^[A-Za-z0-9._@+-]+$"
          example: admin
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          description: Email address; the policy (see the operation) is checked by the server (422)
          minLength: 1
          maxLength: 1024
          example: owner@example.com
        password:
          type: string
          format: password
          description: 12-128 characters, not equal to the email; checked by the server (422)
          minLength: 1
          maxLength: 1024
    PublicConfig:
      type: object
      additionalProperties: false
      required: [registrationEnabled]
      properties:
        registrationEnabled:
          type: boolean
          description: Whether `POST /api/v1/auth/register` accepts registrations
    SessionInfo:
      type: object
      additionalProperties: false
      required: [user, tenant, role, csrf_token, expires_at]
      properties:
        user:
          $ref: "#/components/schemas/User"
        tenant:
          $ref: "#/components/schemas/Tenant"
        role:
          $ref: "#/components/schemas/MembershipRole"
        csrf_token:
          type: string
          description: Send as `X-CSRF-Token` on unsafe requests
        expires_at:
          type: string
          format: date-time
    User:
      type: object
      additionalProperties: false
      required: [id, login, display_name]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
          description: Lowercase login, the email address of a registered user (the default admin is `admin`)
          example: admin
        display_name:
          type: string
    Tenant:
      type: object
      additionalProperties: false
      required: [id, slug, name]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
    MembershipRole:
      type: string
      enum: [owner, admin, member, viewer]
    MonitorStatus:
      type: string
      description: Aggregated status. `unknown` until the first check after creation, resume or a URL change (for a heartbeat, until the first ping or the first missed deadline), and while the monitor is paused (`paused` is then true).
      enum: [unknown, up, down]
    MonitorType:
      type: string
      description: "`http`: an HTTPS check every minute. `heartbeat`: a watchdog that expects pings on its secret URL."
      enum: [http, heartbeat]
    HeartbeatToken:
      type: object
      additionalProperties: false
      required: [heartbeatUrl]
      properties:
        heartbeatUrl:
          type: string
          description: The secret ping URL; shown once, store it like a password
          example: https://maiak.klr-ops.net/api/v1/heartbeat/3q2-7wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    ExpectedStatus:
      type: string
      description: |
        `2xx` (any 200-299), or one exact HTTP status code from 200 to 299 or from 400 to 599, as a
        string. 1xx and 3xx cannot be observed (the client consumes 1xx and follows redirects) and
        are rejected.
      pattern: "^(2xx|2[0-9]{2}|[45][0-9]{2})$"
      example: 2xx
    MonitorCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        type:
          $ref: "#/components/schemas/MonitorType"
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: Website
        url:
          type: string
          description: Required for `http`. HTTPS URL on port 443, without credentials; hosts that are private IP literals or internal names are rejected
          minLength: 1
          maxLength: 2048
          example: https://example.com/health
        expectedIntervalSeconds:
          type: integer
          description: Heartbeat only. How often a ping is expected; 300 when omitted (no schema default, so http requests stay free of it)
          minimum: 60
          maximum: 86400
        graceSeconds:
          type: integer
          description: Heartbeat only. Extra time after the expected interval before the heartbeat is down; 60 when omitted
          minimum: 0
          maximum: 3600
        intervalSeconds:
          type: integer
          description: Check interval; only 60 is accepted in the MVP
          default: 60
        timeoutSeconds:
          type: integer
          description: Request deadline including redirects; only 10 is accepted in the MVP
          default: 10
        expectedStatus:
          $ref: "#/components/schemas/ExpectedStatus"
        failureThreshold:
          type: integer
          description: Consecutive failures before the monitor is down
          minimum: 1
          maximum: 3
          default: 2
        notifySlack:
          type: boolean
          default: true
    MonitorUpdate:
      type: object
      additionalProperties: false
      description: Only the given fields change. `intervalSeconds` and `timeoutSeconds` are accepted only with their current value.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        url:
          type: string
          minLength: 1
          maxLength: 2048
        intervalSeconds:
          type: integer
        timeoutSeconds:
          type: integer
        expectedStatus:
          $ref: "#/components/schemas/ExpectedStatus"
        failureThreshold:
          type: integer
          minimum: 1
          maximum: 3
        notifySlack:
          type: boolean
        expectedIntervalSeconds:
          type: integer
          minimum: 60
          maximum: 86400
        graceSeconds:
          type: integer
          minimum: 0
          maximum: 3600
    Incident:
      type: object
      additionalProperties: false
      required: [id, startedAt, resolvedAt, reason]
      properties:
        id:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          description: Why the monitor went down (the error kind of the failing checks, for example `timeout`, `unexpected_status` or `heartbeat_missed`)
    OngoingIncident:
      type: object
      nullable: true
      additionalProperties: false
      description: The open incident of a monitor; null when there is none
      required: [id, startedAt, reason]
      properties:
        id:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        reason:
          type: string
    MonitorListItem:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - name
        - url
        - intervalSeconds
        - timeoutSeconds
        - expectedStatus
        - failureThreshold
        - notifySlack
        - paused
        - status
        - statusSince
        - lastErrorKind
        - lastCheckedAt
        - tlsExpiresAt
        - ongoingIncident
        - lastPingAt
        - expectedIntervalSeconds
        - graceSeconds
        - uptime24h
        - lastResponseMs
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/MonitorType"
        name:
          type: string
        url:
          type: string
          description: The checked URL; empty for a heartbeat
        intervalSeconds:
          type: integer
        timeoutSeconds:
          type: integer
        expectedStatus:
          $ref: "#/components/schemas/ExpectedStatus"
        failureThreshold:
          type: integer
        notifySlack:
          type: boolean
        paused:
          type: boolean
        status:
          $ref: "#/components/schemas/MonitorStatus"
        statusSince:
          type: string
          format: date-time
          description: When the status last changed
        lastErrorKind:
          type: string
          nullable: true
          description: Error kind of the last failed check, null after a success
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true
        tlsExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: Expiry of the certificate seen by the last successful check
        ongoingIncident:
          $ref: "#/components/schemas/OngoingIncident"
        lastPingAt:
          type: string
          format: date-time
          nullable: true
          description: Heartbeat only. Time of the newest accepted ping; null before the first and for http monitors
        expectedIntervalSeconds:
          type: integer
          nullable: true
          description: Heartbeat only (null for http monitors)
        graceSeconds:
          type: integer
          nullable: true
          description: Heartbeat only (null for http monitors)
        uptime24h:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 100
          description: Percentage of successful checks in the last 24 h; null when no check ran
        lastResponseMs:
          type: integer
          nullable: true
          description: Response time of the last check in milliseconds; null when no check ran
    MonitorSummary:
      type: object
      additionalProperties: false
      required: [up, down, paused, unknown]
      description: Counts over all non-deleted monitors. A paused monitor counts only as paused.
      properties:
        up:
          type: integer
        down:
          type: integer
        paused:
          type: integer
        unknown:
          type: integer
    MonitorList:
      type: object
      additionalProperties: false
      required: [summary, items]
      properties:
        summary:
          $ref: "#/components/schemas/MonitorSummary"
        items:
          type: array
          items:
            $ref: "#/components/schemas/MonitorListItem"
    Uptime:
      type: object
      additionalProperties: false
      required: [h24, d7, d30]
      description: Percentage of successful checks per window; null when no check ran in it
      properties:
        h24:
          type: number
          format: double
          nullable: true
        d7:
          type: number
          format: double
          nullable: true
        d30:
          type: number
          format: double
          nullable: true
    MonitorDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - name
        - url
        - intervalSeconds
        - timeoutSeconds
        - expectedStatus
        - failureThreshold
        - notifySlack
        - paused
        - status
        - statusSince
        - lastErrorKind
        - lastCheckedAt
        - tlsExpiresAt
        - ongoingIncident
        - lastPingAt
        - expectedIntervalSeconds
        - graceSeconds
        - uptime
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/MonitorType"
        name:
          type: string
        url:
          type: string
          description: The checked URL; empty for a heartbeat
        intervalSeconds:
          type: integer
        timeoutSeconds:
          type: integer
        expectedStatus:
          $ref: "#/components/schemas/ExpectedStatus"
        failureThreshold:
          type: integer
        notifySlack:
          type: boolean
        paused:
          type: boolean
        status:
          $ref: "#/components/schemas/MonitorStatus"
        statusSince:
          type: string
          format: date-time
        lastErrorKind:
          type: string
          nullable: true
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true
        tlsExpiresAt:
          type: string
          format: date-time
          nullable: true
        ongoingIncident:
          $ref: "#/components/schemas/OngoingIncident"
        lastPingAt:
          type: string
          format: date-time
          nullable: true
          description: Heartbeat only. Time of the newest accepted ping; null before the first and for http monitors
        expectedIntervalSeconds:
          type: integer
          nullable: true
          description: Heartbeat only (null for http monitors)
        graceSeconds:
          type: integer
          nullable: true
          description: Heartbeat only (null for http monitors)
        uptime:
          $ref: "#/components/schemas/Uptime"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        heartbeatUrl:
          type: string
          description: Only in the response that creates a heartbeat. The secret ping URL; it is not stored and cannot be shown again
    StatsRange:
      type: string
      enum: [24h, 7d, 30d]
      default: 24h
    LatencyPoint:
      type: object
      additionalProperties: false
      required: [t, avgMs, okRatio]
      properties:
        t:
          type: string
          format: date-time
          description: Start of the bucket (UTC)
        avgMs:
          type: number
          format: double
          nullable: true
          description: Average response time of the checks in the bucket that received a response (failed checks with an HTTP status included); null when none did
        okRatio:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 1
          description: Share of successful checks in the bucket; null when no check ran
    MonitorStats:
      type: object
      additionalProperties: false
      required: [range, avgMs, p95Ms, series]
      properties:
        range:
          $ref: "#/components/schemas/StatsRange"
        avgMs:
          type: number
          format: double
          nullable: true
          description: Average response time of the checks in the range that received a response (failed checks with an HTTP status included); null when none did
        p95Ms:
          type: number
          format: double
          nullable: true
        series:
          type: array
          items:
            $ref: "#/components/schemas/LatencyPoint"
    Check:
      type: object
      additionalProperties: false
      required: [checkedAt, location, ok, httpStatus, responseMs, errorKind]
      properties:
        checkedAt:
          type: string
          format: date-time
        location:
          type: string
          description: Code of the probe location
          example: home-eu-central-1
        ok:
          type: boolean
        httpStatus:
          type: integer
          nullable: true
        responseMs:
          type: integer
          nullable: true
        errorKind:
          type: string
          nullable: true
    CheckList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Check"
    IncidentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Incident"
    SlackSettings:
      type: object
      additionalProperties: false
      required: [configured]
      properties:
        configured:
          type: boolean
          description: Whether a webhook is stored (the URL itself is never returned)
        status:
          type: string
          enum: [active, failed]
          description: Present when configured. `failed` means Slack answered 404 or 410 (the webhook was revoked); alerts are not sent until a new URL is stored.
    SlackSettingsUpdate:
      type: object
      additionalProperties: false
      required: [webhookUrl]
      properties:
        webhookUrl:
          type: string
          format: password
          description: Slack Incoming Webhook URL, `https://hooks.slack.com/services/...`; write-only
          minLength: 1
          maxLength: 2048
    Usage:
      type: object
      additionalProperties: false
      required: [plan, limits, usage]
      properties:
        plan:
          $ref: "#/components/schemas/PlanRef"
        limits:
          $ref: "#/components/schemas/ResourceCounts"
        usage:
          $ref: "#/components/schemas/ResourceCounts"
    PlanRef:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key:
          type: string
          example: free
        name:
          type: string
          example: Free
    ResourceCounts:
      type: object
      additionalProperties: false
      required: [monitors, heartbeats, channels]
      properties:
        monitors:
          type: integer
          minimum: 0
          description: HTTPS monitors
        heartbeats:
          type: integer
          minimum: 0
          description: Heartbeat (watchdog) monitors
        channels:
          type: integer
          minimum: 0
          description: Notification channels (the Slack webhook)
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          description: Dotted path of the request body field
          example: url
        message:
          type: string
          example: must use https
    Problem:
      type: object
      description: RFC 9457 problem details
      required: [type, title, status]
      properties:
        type:
          type: string
          description: URI reference identifying the problem type
          example: urn:maiak:problem:unauthenticated
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        fieldErrors:
          type: array
          description: Per-field validation errors (400 and 422)
          items:
            $ref: "#/components/schemas/FieldError"
        limit:
          type: string
          enum: [monitors, heartbeats, channels]
          description: Which plan limit was reached (only with `urn:maiak:problem:plan-limit-reached`)
        max:
          type: integer
          minimum: 0
          description: The value of that limit for the tenant (only with `urn:maiak:problem:plan-limit-reached`)
