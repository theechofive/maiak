        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
        offset:
          type: integer
    TemporaryPassword:
      type: object
      additionalProperties: false
