    AuthProviders:
      type: object
      additionalProperties: false
      required: [providers, passwordLoginEnabled, registrationEnabled]
      properties:
        providers:
          type: array
          description: Configured OAuth providers, in the order the login page shows them
          items:
            $ref: "#/components/schemas/AuthProvider"
        passwordLoginEnabled:
          type: boolean
          description: Whether the password form is offered to everyone; when false only the platform admin uses it, on `/login?admin`
        registrationEnabled:
          type: boolean
          description: Whether an OAuth sign-in or `POST /api/v1/auth/register` may create a new organization
    AuthProvider:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          $ref: "#/components/schemas/OAuthProvider"
        name:
          type: string
          example: Google
    OAuthIntent:
      type: string
      enum: [login, link]
    OAuthStartRequest:
      type: object
      additionalProperties: false
      properties:
        intent:
          $ref: "#/components/schemas/OAuthIntent"
        inviteToken:
          type: string
          format: password
          description: The token of an invitation link (only with intent login); join that organization
          minLength: 1
          maxLength: 128
    OAuthStart:
      type: object
      additionalProperties: false
      required: [authorizationUrl]
      properties:
        authorizationUrl:
          type: string
          description: The provider's authorization URL; navigate the whole window there
    Identity:
      type: object
      additionalProperties: false
      required: [provider, email, createdAt, lastLoginAt]
      properties:
        provider:
          $ref: "#/components/schemas/OAuthProvider"
        email:
          type: string
          description: The verified email the provider reported at the last sign-in or link
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
    IdentityList:
      type: object
      additionalProperties: false
      required: [items, passwordSet, passwordLoginEnabled]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Identity"
        passwordSet:
          type: boolean
          description: Whether the user has a password
        passwordLoginEnabled:
          type: boolean
          description: Whether this user may sign in with the password (always true for the platform admin)
    AuthDomainRole:
      type: string
      enum: [admin, member, viewer]
    AuthDomain:
      type: object
      additionalProperties: false
      required: [id, domain, defaultRole, enabled, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        domain:
          type: string
          example: example.com
        defaultRole:
          $ref: "#/components/schemas/AuthDomainRole"
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AuthDomainList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuthDomain"
    AuthDomainCreate:
      type: object
      additionalProperties: false
      required: [domain]
      properties:
        domain:
          type: string
          description: A Google Workspace primary domain such as example.com; lowercased by the server (422 when not a domain name)
          minLength: 1
          maxLength: 253
        defaultRole:
          description: Only `viewer` is accepted at creation (422 otherwise); change it with PATCH
          allOf:
            - $ref: "#/components/schemas/AuthDomainRole"
        enabled:
          type: boolean
    AuthDomainUpdate:
      type: object
      additionalProperties: false
      properties:
        defaultRole:
          $ref: "#/components/schemas/AuthDomainRole"
        enabled:
          type: boolean
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          description: Dotted path of the request body field
          example: url
        message:
          type: string
          example: must use https
    Problem:
      type: object
      description: RFC 9457 problem details
      required: [type, title, status]
      properties:
        type:
          type: string
          description: URI reference identifying the problem type
          example: urn:maiak:problem:unauthenticated
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        fieldErrors:
          type: array
          description: Per-field validation errors (400 and 422)
          items:
            $ref: "#/components/schemas/FieldError"
        limit:
          type: string
          enum: [monitors, heartbeats, channels, members, projects, statusPages]
          description: Which plan limit was reached (only with `urn:maiak:problem:plan-limit-reached`)
        max:
          type: integer
          minimum: 0
          description: The value of that limit for the tenant (only with `urn:maiak:problem:plan-limit-reached`)
