openapi: 3.0.3
info:
  title: Maiak API
  version: 0.9.0
  description: |
    REST API of Maiak, the multi-tenant uptime-monitoring service. This file is the source of
    truth: the Go server and the TypeScript client are generated from it (ADR-0008).

    Authentication is a server-side session in the HttpOnly cookie `maiak_session`. Unsafe
    methods (POST, PUT, PATCH, DELETE) on authenticated endpoints also need the header
    `X-CSRF-Token` with the `csrf_token` returned by login, registration and
    `GET /api/v1/auth/me`; a missing or wrong token is answered with 403. Only health, the public
    config, login, registration, the sign-in providers, the OAuth start and callback and the
    heartbeat ping work without a session.

    Errors are `application/problem+json` (RFC 9457). A request that does not match this
    contract (malformed JSON, wrong types, unknown or missing fields) gets 400; a well-formed
    request that breaks a business rule (for example a URL with a private IP literal) gets 422.
    Both carry `fieldErrors` when the problem can be attributed to request body fields.

    Field names of the monitor, check, incident and channel resources are camelCase. The auth
    resources predate that convention and keep their snake_case names (ADR-0017).

    Roles (ADR-0102): every operation that needs a session has a minimum role of the session's
    membership in its organization (tenant). `viewer` reads; `member` also creates, edits,
    pauses and deletes monitors; `admin` also manages notification channels, members,
    invitations, projects and the status page; `owner` also deletes the organization, manages its sign-in domains and grants or revokes `owner`. A role below
    the minimum gets 403 `urn:maiak:problem:forbidden`. A role change applies on the next request.

    Projects (ADR-0102, T-02): monitors (heartbeats included) and notification channels belong to
    a project of the organization; a channel may instead be organization-wide (`projectId` null).
    Owners and admins see every project. Members and viewers see the projects they belong to (the
    Default project includes every member) and only their monitors, checks, statistics,
    incidents and channels, plus organization-wide channels; anything else is answered 404 as if it
    did not exist. Inside a project a member may have a `viewer` override, which makes it
    read-only there (403 on changes).
  contact:
    name: Maiak maintainers
    url: https://github.com/theechofive/maiak
servers:
  - url: https://maiak.klr-ops.net
    description: Internal deployment on klr-platform (same origin as the web app)
tags:
  - name: system
    description: Service metadata
  - name: auth
    description: Login, logout, the current session and the organizations of the user
  - name: members
    description: |
      Members of the organization, their roles and invitations (ADR-0102). Roles are `owner`,
      `admin`, `member` and `viewer`; every operation has a minimum role, and a session whose role
      is below it gets 403 `urn:maiak:problem:forbidden`.
  - name: projects
    description: |
      Projects of the organization and their members (ADR-0102, T-02). Every organization has a
      Default project that includes all its members. Owners and admins manage projects.
  - name: monitors
    description: HTTPS and heartbeat (watchdog) monitors, their status, statistics, checks and incidents
  - name: heartbeat
    description: The public ping endpoint of heartbeat monitors
  - name: channels
    description: Notification channels (Slack Incoming Webhooks) and their test message
  - name: status-page
    description: |
      The organization's public status page (ADR-0103): configuration, components, password and
      a preview. Owners and admins change it; every role reads the page settings and its link.
      The public page itself is served by the separate statuspage process under `/status/<slug>`.
  - name: plan
    description: The tenant's plan, its limits and the current usage
  - name: admin
    description: |
      Platform administration across tenants (ADR-0097). Only the platform admin (the system
      admin configured by `MAIAK_ADMIN_LOGIN`, `isPlatformAdmin` in the user object) may call
      these operations; any other session gets 403 `urn:maiak:problem:forbidden`.
security:
  - cookieAuth: []
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Service health and build info
      description: Public liveness information for humans and simple checks. Does not touch the database.
      tags: [system]
      security: []
      responses:
        "200":
          description: The api process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/public/config:
    get:
      operationId: getPublicConfig
      summary: Settings the web app needs before login
      description: Public, needs no session. Tells the web app whether to offer registration.
      tags: [system]
      security: []
      responses:
        "200":
          description: The public configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConfig"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Log in with login and password
      description: |
        Creates a session and sets the `maiak_session` cookie. The login is an email address or
        the system login (`admin`), case-insensitive (normalised to lowercase); the session is
        bound to the user's tenant. Failures always return the same generic error. Attempts are
        rate limited per client IP and per normalised login. Like registration, it needs no CSRF
        token (there is no session yet). When the login and password are right but the tenant was
        suspended or deleted by the platform admin, the answer is 403
        `urn:maiak:problem:account-suspended`; a wrong password never reveals that state.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          headers:
            Set-Cookie:
              description: The session cookie (`maiak_session`, HttpOnly, SameSite=Lax)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The tenant is suspended or deleted (`urn:maiak:problem:account-suspended`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Register a new account and workspace
      description: |
        Self-service registration (ADR-0092). Creates a tenant on the `free` plan, the user as its
        `owner` and a session, sets the `maiak_session` cookie and answers like login (the user is
        logged in). There is no email verification and no email is sent.

        The email is trimmed and lowercased; it must be 3-254 characters of `a-z 0-9 . _ + - @`
        (the characters a login may contain) with one `@`, a non-empty local part and a domain
        with a dot. The password must be 12-128 characters (Unicode code points) and differ from
        the email; there are no composition rules. Policy failures are 422 with `fieldErrors`.

        An email that is already registered is answered with 409 `urn:maiak:problem:email-taken`:
        without verification, registration cannot hide whether an account exists. When
        registration is turned off (`MAIAK_REGISTRATION_ENABLED=false`) the answer is 403
        `urn:maiak:problem:registration-disabled`.

        With `inviteToken` (ADR-0102) no organization is created: the user joins the inviting
        organization with the invited role, and the invitation is used up. This works also when
        registration is turned off, because the invitation is the authorization. An unknown,
        expired, used or revoked token is 404 `urn:maiak:problem:invitation-invalid`, and counts
        against the per-client-IP invitation limit (429). When the email already has an account,
        the password must be that account's password (checked like a login): the account joins the
        organization and is signed in there; a wrong password is 401
        `urn:maiak:problem:invalid-credentials` (the same answer as a failed login) and leaves the
        invitation open. Failed attempts count per client IP, per invitation and per login. Every attempt that reaches the password hash
        counts against the per-client-IP limit of the login, and hashing shares the login's
        bounded queue (429 with Retry-After). No CSRF token is needed (there is no session yet).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered and logged in
          headers:
            Set-Cookie:
              description: The session cookie (`maiak_session`, HttpOnly, SameSite=Lax)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Registration is turned off (`urn:maiak:problem:registration-disabled`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The invitation token is unknown, expired, used or revoked (`urn:maiak:problem:invitation-invalid`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: |
            The email is already registered (`urn:maiak:problem:email-taken`), or the invited
            organization has reached its member limit (`urn:maiak:problem:plan-limit-reached`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Log out
      description: Deletes the current session and clears the cookie.
      tags: [auth]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Logged out
          headers:
            Set-Cookie:
              description: Expires the session cookie
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/me:
    get:
      operationId: getMe
      summary: Current user and session
      description: Returns the logged-in user, the tenant of the session and the CSRF token.
      tags: [auth]
      responses:
        "200":
          description: The current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/organizations:
    get:
      operationId: listOrganizations
      summary: Organizations of the current user
      description: |
        Every organization (tenant) the user is a member of and that is not deleted, with the
        user's role there and the tenant's status, sorted by name. `current` marks the one the
        session is bound to. Any role.
      tags: [auth]
      responses:
        "200":
          description: The user's organizations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/switch-organization:
    post:
      operationId: switchOrganization
      summary: Switch the session to another organization
      description: |
        Checks that the user is a member of the organization and that it is active, then replaces
        the session with a new one bound to it: a new `maiak_session` cookie and a new CSRF token
        in the answer; the old session is deleted. 404 when the user is not a member of an
        organization with that id (or it is deleted), 403 `urn:maiak:problem:account-suspended`
        when it is suspended. Any role.
      tags: [auth]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchOrganizationRequest"
      responses:
        "200":
          description: Switched; the answer describes the new session
          headers:
            Set-Cookie:
              description: The new session cookie (`maiak_session`, HttpOnly, SameSite=Lax)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/providers:
    get:
      operationId: getAuthProviders
      summary: Sign-in methods offered on the login page
      description: |
        Public, needs no session (ADR-0104). The OAuth providers that have credentials configured
        (a provider without them is not listed and its start answers 404), whether the password
        form is offered to everyone (`MAIAK_PASSWORD_LOGIN_ENABLED`; when false only the platform
        admin signs in with a password, on `/login?admin`) and whether self-service registration
        is open.
      tags: [auth]
      security: []
      responses:
        "200":
          description: The enabled sign-in methods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviders"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/oauth/{provider}/start:
    parameters:
      - $ref: "#/components/parameters/OAuthProviderId"
    post:
      operationId: startOAuth
      summary: Start an OAuth sign-in or link
      description: |
        Starts the authorization code flow with PKCE (S256) and returns the provider's
        authorization URL; the web app navigates there. `state`, `nonce` and the PKCE verifier are
        kept in a short-lived (10 minutes) HMAC-signed HttpOnly cookie bound to this browser
        (`__Host-maiak_oauth`, Secure, Path=/; `maiak_oauth` scoped to `/api/v1/auth/oauth/` only
        when the deployment runs without secure cookies). The redirect URI is always
        `MAIAK_PUBLIC_URL/api/v1/auth/oauth/{provider}/callback`.

        `intent: login` (the default) needs no session. With `inviteToken` the sign-in joins the
        inviting organization; the token travels in this body only, never in a URL (an unknown,
        expired, used or revoked token is 404 `urn:maiak:problem:invitation-invalid` and counts
        against the per-client-IP invitation limit).

        `intent: link` adds the provider to the signed-in user's account: it needs the session
        cookie and the `X-CSRF-Token` header (401 without a session, 403 with a wrong token), and
        the callback links the identity to that user only.

        404 when the provider is not configured. Starts count against the per-client-IP login
        limit only when the callback fails (429 with Retry-After once it is exhausted).
      tags: [auth]
      security: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: false
          description: The `csrf_token` of the session; required with `intent` link
          schema:
            type: string
            minLength: 1
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthStartRequest"
      responses:
        "200":
          description: The authorization URL to navigate to
          headers:
            Set-Cookie:
              description: The signed state cookie (`__Host-maiak_oauth`, Secure, HttpOnly, SameSite=Lax, 10 minutes)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthStart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/oauth/{provider}/callback:
    parameters:
      - $ref: "#/components/parameters/OAuthProviderId"
    get:
      operationId: oauthCallback
      summary: Finish an OAuth sign-in or link (provider redirect)
      description: |
        The provider redirects the browser here. The `state` must match the signed cookie of
        `startOAuth` (same browser, same provider, not older than 10 minutes); the code is
        exchanged with the PKCE verifier. Never answers JSON: it always redirects (303) and clears
        the state cookie.

        Sign-in (`intent: login`): the user is found by the provider's stable id (Google `sub`,
        GitHub numeric id), never by email. Google needs `email_verified`; GitHub uses the primary
        verified address only. Without a linked user, an account is created only with a valid
        invitation, a Google Workspace domain (`hd`) claimed by an organization, or open
        registration; an email that already belongs to an account is never linked automatically
        (`account_exists`: sign in with the password, then link). Success sets the session cookie
        like a password login and redirects to `/`.

        Link (`intent: link`): the identity is added to the signed-in user and the browser goes to
        `/profile?linked=<provider>`; errors go to `/profile?error=<code>`.

        Sign-in errors redirect to `/login?error=<code>`, with one of `cancelled`, `failed`,
        `state_invalid`, `email_unverified`, `email_unusable`, `not_invited`, `account_exists`,
        `invitation_invalid`, `already_member`, `plan_limit`, `suspended`, `rate_limited`; link
        errors add `identity_in_use`, `already_linked` and `session_expired`. Provider error text
        is never reflected. Every outcome is audited (`auth.oauth_login`, `auth.oauth_failed`,
        `auth.identity_linked`). Failed callbacks count against the login's per-client-IP limit.
      tags: [auth]
      security: []
      parameters:
        - name: code
          in: query
          required: false
          description: The authorization code
          schema:
            type: string
            maxLength: 2048
        - name: state
          in: query
          required: false
          description: The state sent with the authorization request
          schema:
            type: string
            maxLength: 512
        - name: error
          in: query
          required: false
          description: The provider's error code (for example `access_denied`); never shown
          schema:
            type: string
            maxLength: 256
      responses:
        "303":
          description: Redirect to the web app
          headers:
            Location:
              description: "`/`, `/login?error=<code>`, `/profile?linked=<provider>` or `/profile?error=<code>`"
              schema:
                type: string
            Set-Cookie:
              description: The session cookie on a successful sign-in, and the expired state cookie
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/identities:
    get:
      operationId: listIdentities
      summary: Sign-in methods of the current user
      description: |
        The OAuth identities linked to the logged-in user (provider, the email it reported at the
        last sign-in, when it was linked and last used), whether the user has a password, and
        whether password sign-in is enabled for the user. Any role.
      tags: [auth]
      responses:
        "200":
          description: The user's sign-in methods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/identities/{provider}:
    parameters:
      - $ref: "#/components/parameters/OAuthProviderId"
    delete:
      operationId: unlinkIdentity
      summary: Unlink an OAuth identity from the current user
      description: |
        Removes the user's identity of that provider. Allowed only while another way to sign in
        remains: a password (when password sign-in is enabled, or for the platform admin) or
        another identity; otherwise 409 `urn:maiak:problem:last-login-method`. 404 when no
        identity of that provider is linked. Audited as `auth.identity_unlinked`. Any role.
      tags: [auth]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Unlinked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/monitors:
    get:
      operationId: listMonitors
      summary: List monitors with their current status
      description: |
        The monitors of the tenant that are not deleted and that the caller sees (the projects it
        belongs to; every project for owners and admins), with the current status and summary
        counts. `projectId` limits the list to one project (404 when the caller does not see it).
        Answered from the state tables and rollups, never by scanning raw results.
      tags: [monitors]
      parameters:
        - $ref: "#/components/parameters/ProjectFilter"
      responses:
        "200":
          description: The monitors of the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createMonitor
      summary: Create a monitor
      description: |
        Creates an HTTPS monitor (`type` `http`, the default) or a heartbeat monitor (`type`
        `heartbeat`). An HTTPS monitor needs `url`; it starts with status `unknown` and is first
        checked within about 30 seconds. A heartbeat takes `expectedIntervalSeconds` and
        `graceSeconds` instead and must not send `url` or `expectedStatus` (422);
        `intervalSeconds`, `timeoutSeconds` and `failureThreshold` are ignored (one missed deadline
        is down). The
        response of a heartbeat carries `heartbeatUrl`, the secret ping URL, which is shown only
        here and by `POST /api/v1/monitors/{monitorId}/heartbeat-token`. A heartbeat stays
        `unknown` until its first ping (then `up`) or until its first deadline passes (then
        `down`).

        `projectId` is the monitor's project (the Default project when omitted); the caller needs
        the `member` role in it (403 with a viewer override, 422 for a project it does not see).
        `channelIds` selects the notification channels of the monitor (at most 10, each a channel
        of the monitor's project or an organization-wide one, 422 otherwise); with no selection,
        `notifySlack` sends to the active channels of the monitor's own project only (not to
        organization-wide ones).

        Fails with 409 `urn:maiak:problem:plan-limit-reached` (`limit` is `monitors` or
        `heartbeats`) when the tenant already has as many monitors of that type as its plan allows
        (deleted monitors do not count, see `GET /api/v1/usage`), and with 503 when the probe
        location that runs new monitors is unavailable.
      tags: [monitors]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitorCreate"
      responses:
        "201":
          description: The created monitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/PlanLimitReached"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/monitors/{monitorId}:
    parameters:
      - $ref: "#/components/parameters/MonitorId"
    get:
      operationId: getMonitor
      summary: One monitor with status and uptime
      description: The monitor with its current status, TLS expiry, ongoing incident and uptime for 24 h, 7 d and 30 d.
      tags: [monitors]
      responses:
        "200":
          description: The monitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMonitor
      summary: Edit a monitor
      description: |
        Changes the given fields. `intervalSeconds` and `timeoutSeconds` cannot be changed in the
        MVP: sending them with a different value fails with 422. A heartbeat may change `name`,
        `expectedIntervalSeconds`, `graceSeconds` and `notifySlack` (its deadline follows the new
        values); `failureThreshold` is ignored and the http fields fail with 422, as do the
        heartbeat fields on an http monitor. `channelIds` replaces the monitor's channel selection
        (an empty list selects none, which means the active channels of the monitor's project).
        `projectId` moves the monitor to another project; the caller needs the `member` role in
        both. Selected channels of the old project are dropped from the selection (organization-wide
        ones stay); `channelIds` sent in the same request is checked against the new project.
      tags: [monitors]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitorUpdate"
      responses:
        "200":
          description: The updated monitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteMonitor
      summary: Delete a monitor
      description: |
        Soft delete: the monitor stops being checked, an open incident is resolved without a
        notification, history is kept until retention and the monitor no longer counts toward
        the limit.
      tags: [monitors]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/monitors/{monitorId}/pause:
    parameters:
      - $ref: "#/components/parameters/MonitorId"
    post:
      operationId: pauseMonitor
      summary: Pause a monitor
      description: Stops checking. An open incident is resolved without a notification. Idempotent.
      tags: [monitors]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The paused monitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/monitors/{monitorId}/resume:
    parameters:
      - $ref: "#/components/parameters/MonitorId"
    post:
      operationId: resumeMonitor
      summary: Resume a paused monitor
      description: Starts checking again within about 30 seconds; the status is `unknown` until the first check. Idempotent.
      tags: [monitors]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The resumed monitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/monitors/{monitorId}/heartbeat-token:
    parameters:
      - $ref: "#/components/parameters/MonitorId"
    post:
      operationId: regenerateHeartbeatToken
      summary: Give a heartbeat a new ping URL
      description: |
        Replaces the token of a heartbeat monitor. The old URL stops working immediately (it is
        answered like any unknown token) and the new one is returned once: only a hash is stored,
        so the server cannot show it again. Fails with 409 `urn:maiak:problem:not-a-heartbeat`
        for an HTTPS monitor.
      tags: [monitors]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The new ping URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/heartbeat/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: The secret token of the heartbeat's URL. Any value is accepted here; an unknown or malformed one gets 404.
        schema:
          type: string
    get:
      operationId: pingHeartbeat
      summary: Ping a heartbeat monitor
      description: |
        Public on purpose (ADR-0094): Alertmanager's webhook receiver and cron jobs call it without
        a session and without a CSRF token; the token in the URL is the credential. Records a ping
        and answers 204. A paused or deleted heartbeat also gets 204 but nothing is recorded. Any
        unknown or malformed token gets the same 404 problem. At most one ping per second per
        token is accepted; unknown tokens are rate limited per client IP, which never limits a
        known token; excess requests get 429, as do pings while the server has too many in
        flight (ADR-0096).
      tags: [heartbeat]
      security: []
      responses:
        "204":
          description: The ping was accepted
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: pingHeartbeatPost
      summary: Ping a heartbeat monitor (POST)
      description: |
        The same as the GET, for senders that can only POST (Alertmanager's webhook receiver). The
        body is ignored (at most 64 KiB is read).
      tags: [heartbeat]
      security: []
      responses:
        "204":
          description: The ping was accepted
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/monitors/{monitorId}/stats:
    parameters:
      - $ref: "#/components/parameters/MonitorId"
    get:
      operationId: getMonitorStats
      summary: Response time statistics
      description: |
        Average and p95 response time and the latency series for the range. Latency statistics
        cover checks that got a response. `24h` is computed from raw results (exact p95) in
        15-minute buckets; `7d` (hourly buckets) and `30d` (6-hour buckets) from hourly rollups,
        where p95 is the upper edge of the histogram bucket that contains the 95th percentile
        (edges 10, 25, 50, 100, 250, 500, 1000, 2500, 5000, 10000 ms). Every bucket of the range is
        listed; buckets without checks have null values.
      tags: [monitors]
      parameters:
        - name: range
          in: query
          required: false
          description: Time range ending now
          schema:
            $ref: "#/components/schemas/StatsRange"
      responses:
        "200":
          description: Statistics for the range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorStats"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/monitors/{monitorId}/checks:
    parameters:
      - $ref: "#/components/parameters/MonitorId"
    get:
      operationId: listMonitorChecks
      summary: Recent checks
      description: The most recent check results of the monitor, newest first.
      tags: [monitors]
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of checks to return
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Recent checks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/monitors/{monitorId}/incidents:
    parameters:
      - $ref: "#/components/parameters/MonitorId"
    get:
      operationId: listMonitorIncidents
      summary: Incidents of a monitor
      description: Incidents of the monitor, newest first, at most 100.
      tags: [monitors]
      responses:
        "200":
          description: Incidents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/usage:
    get:
      operationId: getUsage
      summary: Plan, limits and usage
      description: |
        The tenant's plan, its effective limits (the plan's limits with per-tenant overrides
        applied) and the current usage. Deleted monitors do not count.
      tags: [plan]
      responses:
        "200":
          description: Plan, limits and usage of the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/channels:
    get:
      operationId: listChannels
      summary: List notification channels
      description: |
        The tenant's notification channels that are not deleted and that the caller sees (the
        channels of its projects and the organization-wide ones; all for owners and admins),
        oldest first. With `projectId`, the channels a monitor of that project may select: the
        project's channels and the organization-wide ones (404 when the caller does not see the
        project). The webhook URL is a secret and is never returned.
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/ProjectFilter"
      responses:
        "200":
          description: The channels of the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createChannel
      summary: Create a notification channel
      description: |
        Creates a Slack channel. `webhookUrl` must match `https://hooks.slack.com/services/...`
        and is stored encrypted; it is write-only. `events` defaults to every event. `mention`
        holds at most three of `@here`, `@channel`, `<!subteam^ID>` (a user group) and `<@UID>` (a
        user), case-sensitive, and is used only in `down` and reminder messages.
        `reminderMinutes` is 0 (no reminders, the default) or 5 to 1440: while an incident stays
        open, the channel gets a reminder every that many minutes. Business-rule failures are 422
        with `fieldErrors`. Fails with 409 `urn:maiak:problem:plan-limit-reached` (`limit` is
        `channels`) when the tenant already has as many channels as its plan allows (deleted
        channels do not count). The channel belongs to `projectId` (the Default project when
        omitted) or, with `organizationWide: true`, to the whole organization.
      tags: [channels]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelCreate"
      responses:
        "201":
          description: The created channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/PlanLimitReached"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/channels/{channelId}:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      operationId: getChannel
      summary: One notification channel
      description: Returns one notification channel of the organization. The webhook URL is never returned.
      tags: [channels]
      responses:
        "200":
          description: The channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateChannel
      summary: Edit a notification channel
      description: |
        Changes the given fields, with the rules of create. A new `webhookUrl` replaces the stored
        one and makes a `failed` channel `active` again; deliveries already queued for the channel
        go to the new URL. `projectId` moves the channel to a project and drops it from the
        selection of monitors of other projects; `organizationWide: true` makes it
        organization-wide (both together are 422).
      tags: [channels]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelUpdate"
      responses:
        "200":
          description: The updated channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteChannel
      summary: Delete a notification channel
      description: |
        Deletes the channel and its stored webhook URL. Monitors that selected it lose it from
        their selection (a monitor left with no selection then notifies the active channels of its
        own project), and
        its deliveries that are still queued are not sent (they end as failed, `channel_deleted`).
      tags: [channels]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/channels/{channelId}/test:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    post:
      operationId: testChannel
      summary: Send a test message to a channel
      description: Sends a test message to the channel's webhook. Fails with 404 for an unknown channel, 429 when the tenant tested a channel within the last 5 seconds or when Slack rate-limits the webhook (both with Retry-After), and 502 when Slack does not accept the message (Slack's answer is never returned). A removed or revoked webhook (Slack answers 404 or 410) marks the channel `failed`.
      tags: [channels]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Slack accepted the message
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: Projects of the organization
      description: The projects the caller sees (every project for owners and admins), Default first, then by name.
      tags: [projects]
      responses:
        "200":
          description: The projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProject
      summary: Create a project
      description: |
        Admin or owner. `slug` is derived from `name` when omitted; a slug in use is 409
        `urn:maiak:problem:slug-taken`. At most 50 projects per organization: 409
        `urn:maiak:problem:plan-limit-reached` (`limit` is `projects`). Audited as `project.created`.
      tags: [projects]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: The created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      summary: One project
      description: 404 when the project does not exist or the caller does not see it.
      tags: [projects]
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateProject
      summary: Rename a project
      description: Admin or owner. Changes `name` and `slug` (409 `urn:maiak:problem:slug-taken`). Audited as `project.updated`.
      tags: [projects]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: The project after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteProject
      summary: Delete a project
      description: |
        Admin or owner. Only an empty project can be deleted: one with monitors or channels that
        are not deleted is 409 `urn:maiak:problem:project-not-empty`; the Default project is 409
        `urn:maiak:problem:default-project`. Soft delete; its member list is removed. Audited as
        `project.deleted`.
      tags: [projects]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectMembers
      summary: Members of a project
      description: |
        The people with access to the project: owners and admins (they see every project,
        `allProjects` true), the explicit members with their optional role override, and for a
        project with `allMembers` (the Default project) every other member of the organization.
        404 when the caller does not see the project.
      tags: [projects]
      responses:
        "200":
          description: The members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/MemberUserId"
    put:
      operationId: putProjectMember
      summary: Add a member to a project or change its override
      description: |
        Admin or owner. Makes a member of the organization a member of the project. `role`
        `viewer` makes it read-only in this project; omitted (or `member`) keeps its organization
        role. An override never raises the organization role: a viewer stays a viewer. In a project
        with `allMembers` the row only carries the override. Audited as `project.member_changed`.
      tags: [projects]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMemberPut"
      responses:
        "200":
          description: The member after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeProjectMember
      summary: Remove a member from a project
      description: |
        Admin or owner. The member loses access to the project at its next request (in a project
        with `allMembers` only the override is removed). Audited as `project.member_changed`.
      tags: [projects]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/members:
    get:
      operationId: listMembers
      summary: Members of the organization
      description: Every member with login, role and when they joined, oldest first. Any role.
      tags: [members]
      responses:
        "200":
          description: The members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/MemberUserId"
    patch:
      operationId: updateMember
      summary: Change a member's role
      description: |
        Admin or owner. An admin may change only admins, members and viewers and may not grant
        `owner` (403 `urn:maiak:problem:forbidden`). The organization always keeps an active
        owner: demoting the last one is 409 `urn:maiak:problem:last-owner`. The platform admin's
        role in the default organization cannot be changed (409 `urn:maiak:problem:system-admin`).
        Audited as `member.role_changed`. The new role applies on the member's next request.
      tags: [members]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: The member after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeMember
      summary: Remove a member
      description: |
        Admin or owner, with the rules of the role change (an admin cannot remove an owner, the
        last owner cannot be removed, nor the platform admin). The member's sessions in this
        organization end at once; the user and its other memberships stay. Audited as
        `member.removed`. To leave the organization yourself, use `POST /api/v1/organization/leave`.
      tags: [members]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/invitations:
    get:
      operationId: listInvitations
      summary: Invitations of the organization
      description: The newest 200 invitations with their state (open, accepted, revoked or expired). The link of an invitation is never shown again. Admin or owner.
      tags: [members]
      responses:
        "200":
          description: The invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createInvitation
      summary: Invite someone
      description: |
        Creates a single-use invitation with the role `admin`, `member` or `viewer` (`owner` is
        granted by changing a member's role). It expires after 7 days. The answer carries `inviteUrl` with
        the secret token in the URL fragment; it is shown only here (only its SHA-256 is stored)
        and must be handed over like a password (R-213). No email is sent. Open invitations count
        toward the member limit of the plan: 409 `urn:maiak:problem:plan-limit-reached` (`limit`
        is `members`) when members plus open invitations already reach it. Audited as
        `member.invited` (without the token). Admin or owner.
      tags: [members]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreate"
      responses:
        "201":
          description: The invitation and its link, shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/PlanLimitReached"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/invitations/{invitationId}/revoke:
    parameters:
      - $ref: "#/components/parameters/InvitationId"
    post:
      operationId: revokeInvitation
      summary: Revoke an invitation
      description: |
        The link stops working at once and the place it reserved is freed. Revoking a revoked or
        expired invitation changes nothing (204); an accepted one is 409
        `urn:maiak:problem:invitation-accepted` (remove the member instead). Audited as
        `invitation.revoked`. Admin or owner.
      tags: [members]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/invitations/lookup:
    post:
      operationId: lookupInvitation
      summary: What an invitation link offers
      description: |
        Public (no session): the organization name, role and expiry of an open invitation, for the
        invitation page. The token travels in the body, never in a URL, so proxies do not log it.
        Unknown, expired, used and revoked tokens get the same 404
        `urn:maiak:problem:invitation-invalid`. Each 404 counts against a per-client-IP limit
        (429 with Retry-After).
      tags: [members]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationToken"
      responses:
        "200":
          description: The open invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation as the logged-in user
      description: |
        The logged-in user joins the inviting organization with the invited role, the invitation
        is used up, and the session switches to that organization (new cookie and CSRF token, the
        old session is deleted). 404 `urn:maiak:problem:invitation-invalid` for an unknown,
        expired, used or revoked token (counted against the per-client-IP limit, 429); 409
        `urn:maiak:problem:already-member` when the user is already a member, or when the user is
        the platform admin (who belongs to the default organization only); 409
        `urn:maiak:problem:plan-limit-reached` when the organization's member limit was lowered
        below its members. Audited as `member.joined`. Any role.
      tags: [members]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationToken"
      responses:
        "200":
          description: Joined; the answer describes the new session
          headers:
            Set-Cookie:
              description: The new session cookie (`maiak_session`, HttpOnly, SameSite=Lax)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/organization:
    delete:
      operationId: deleteOrganization
      summary: Delete the organization
      description: |
        Owner only. Soft delete, like the platform admin's (ADR-0097): nothing is erased, but no
        member can use the organization any more, its monitors stop and its deliveries are not
        sent. The session's cookie is cleared; members of other organizations can still log in
        there. The default organization cannot be deleted (409
        `urn:maiak:problem:protected-tenant`). Audited as `organization.deleted`.
      tags: [members]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Deleted
          headers:
            Set-Cookie:
              description: Expires the session cookie
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/organization/leave:
    post:
      operationId: leaveOrganization
      summary: Leave the organization
      description: |
        The logged-in user stops being a member; the session ends and the cookie is cleared. The
        last active owner cannot leave (409 `urn:maiak:problem:last-owner`), nor the platform
        admin (409 `urn:maiak:problem:system-admin`). Audited as `member.removed`. Any role.
      tags: [members]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Left
          headers:
            Set-Cookie:
              description: Expires the session cookie
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/organization/auth-domains:
    get:
      operationId: listAuthDomains
      summary: Sign-in domains of the organization
      description: |
        The Google Workspace domains the organization claimed (ADR-0104). A verified Google
        account whose Workspace domain (`hd`) matches an enabled domain joins the organization
        with `defaultRole` on its first sign-in. Owner only.
      tags: [members]
      responses:
        "200":
          description: The claimed domains
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthDomainList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAuthDomain
      summary: Claim a sign-in domain
      description: |
        Claims a Google Workspace domain for the organization. The operator allows only the
        domains in `MAIAK_OAUTH_ALLOWED_DOMAINS` (403 `urn:maiak:problem:domain-not-allowed`; an
        empty list turns claiming off). Proof of control: the owner's linked Google account must
        have signed in or been linked with that Workspace domain (`hd`) in the last 10 minutes
        (link Google again right before claiming), otherwise 403
        `urn:maiak:problem:domain-not-verified`. A domain belongs to one organization of the
        installation only (409 `urn:maiak:problem:domain-taken`). At most 10 domains per
        organization (422). A new domain always starts with `defaultRole` `viewer` (another value
        is 422); raise it with `updateAuthDomain`. Auto-join stops for a domain that the operator
        removes from the list. Audited as `org.auth_domain_changed`. Owner only.
      tags: [members]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthDomainCreate"
      responses:
        "201":
          description: Claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthDomain"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/organization/auth-domains/{domainId}:
    parameters:
      - $ref: "#/components/parameters/AuthDomainId"
    patch:
      operationId: updateAuthDomain
      summary: Change a sign-in domain
      description: |
        Changes the default role or turns auto-join off and on. The domain itself cannot change
        (delete and claim again). Members who already joined keep their role. Audited as
        `org.auth_domain_changed`. Owner only.
      tags: [members]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthDomainUpdate"
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthDomain"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAuthDomain
      summary: Release a sign-in domain
      description: |
        Stops auto-join for the domain and frees it for other organizations. Members who already
        joined stay. Audited as `org.auth_domain_changed`. Owner only.
      tags: [members]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Released
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/status-pages:
    get:
      operationId: listStatusPages
      summary: Status pages of the organization
      description: |
        Every role may read the organization's status pages (ADR-0103: members see the public
        link). The password itself is never returned, only `passwordProtected`.
      tags: [status-page]
      responses:
        "200":
          description: The status pages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusPageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createStatusPage
      summary: Create the status page
      description: |
        Admin or owner. The page starts unpublished and without components. `slug` is global
        (shared by every organization) and public; a slug in use is 409
        `urn:maiak:problem:slug-taken`, a reserved word is 422. The plan allows one page per
        organization: 409 `urn:maiak:problem:plan-limit-reached` (`limit` is `statusPages`).
        Audited as `status_page.created`.
      tags: [status-page]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusPageCreate"
      responses:
        "201":
          description: The created page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/status-pages/{statusPageId}:
    parameters:
      - $ref: "#/components/parameters/StatusPageId"
    get:
      operationId: getStatusPage
      summary: One status page
      description: Returns the settings of one status page of the organization. The password is never returned.
      tags: [status-page]
      responses:
        "200":
          description: The page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateStatusPage
      summary: Change, publish or unpublish the status page
      description: |
        Admin or owner. Only the given fields change; an empty `logoUrl` or `accentColor` removes
        it. `published` publishes or unpublishes the page: the public view is rebuilt in the same
        request and served within about 15 seconds. Audited as `status_page.updated` (field names
        only), `status_page.published` and `status_page.unpublished`.
      tags: [status-page]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusPageUpdate"
      responses:
        "200":
          description: The page after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteStatusPage
      summary: Delete the status page
      description: Admin or owner. Soft delete; the public page answers 404 at once and the slug becomes free. Audited as `status_page.deleted`.
      tags: [status-page]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/status-pages/{statusPageId}/password:
    parameters:
      - $ref: "#/components/parameters/StatusPageId"
    put:
      operationId: setStatusPagePassword
      summary: Protect the status page with a password
      description: |
        Admin or owner. Write-only: the password (at least 12 characters) is stored as an argon2id
        hash and never returned. A protected page serves no JSON, RSS feed or badge, and visitors
        unlock it once per browser for 12 hours. Changing the password signs every visitor out.
        Audited as `status_page.updated` without the value.
      tags: [status-page]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusPagePasswordPut"
      responses:
        "204":
          description: Stored
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: clearStatusPagePassword
      summary: Remove the password of the status page
      description: Admin or owner. The page becomes public to anyone with the link. Audited as `status_page.updated`.
      tags: [status-page]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/status-pages/{statusPageId}/components:
    parameters:
      - $ref: "#/components/parameters/StatusPageId"
    get:
      operationId: listStatusPageComponents
      summary: Components of the status page
      description: Admin or owner (the list names monitors of every project). In page order.
      tags: [status-page]
      responses:
        "200":
          description: The components
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusPageComponentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: putStatusPageComponents
      summary: Replace the components of the status page
      description: |
        Admin or owner. The list is the new content and order of the page: add, rename, regroup,
        reorder and remove components in one call (at most 50). Each names a monitor or heartbeat
        of any project of the organization (422 on `items.N.monitorId` when it does not exist or
        is used twice) and its public name; consecutive components with the same `groupName` are
        shown together. Only the public names, groups, states and up/down history are published,
        never monitor names, URLs or projects. Audited as `status_page.updated`.
      tags: [status-page]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusPageComponentsPut"
      responses:
        "200":
          description: The components after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusPageComponentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/status-pages/{statusPageId}/preview:
    parameters:
      - $ref: "#/components/parameters/StatusPageId"
    get:
      operationId: previewStatusPage
      summary: Preview the public view
      description: |
        Admin or owner. The public projection exactly as `/status/{slug}.json` would serve it now,
        built live and not stored, also for an unpublished page.
      tags: [status-page]
      responses:
        "200":
          description: The public view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusPageSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/stats:
    get:
      operationId: adminGetStats
      summary: Platform-wide counts
      description: Tenants by state, active users, live monitors and heartbeats of tenants that are not deleted, and every plan with its number of tenants. Platform admins only.
      tags: [admin]
      responses:
        "200":
          description: The counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/tenants:
    get:
      operationId: adminListTenants
      summary: List tenants
      description: |
        Tenants of the platform with plan, status and usage, newest first. `query` matches the
        slug, the name, the id or the login of a member (substring, case-insensitive). Deleted
        tenants are listed only with `includeDeleted=true`. Platform admins only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/AdminQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: includeDeleted
          in: query
          required: false
          description: Also list soft-deleted tenants
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: One page of tenants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTenantList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/tenants/{tenantId}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      operationId: adminGetTenant
      summary: One tenant
      description: One tenant with plan, status and usage; deleted tenants included. Platform admins only.
      tags: [admin]
      responses:
        "200":
          description: The tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: adminUpdateTenant
      summary: Change a tenant's plan or status
      description: |
        Changes the plan (`planKey`, an existing plan, otherwise 422) and/or the status (`active`
        or `suspended`, otherwise 422) in one transaction; at least one is required (422). Each
        change writes an audit row in the tenant. A plan change keeps every existing monitor and
        channel: usage above the new limits only blocks new creations. A suspended tenant's users
        cannot log in (403 `urn:maiak:problem:account-suspended`), its sessions stop working, its
        monitors and heartbeats are not checked or evaluated and its Slack deliveries wait. The
        `default` tenant and a tenant the admin belongs to cannot be suspended (409
        `urn:maiak:problem:protected-tenant`); a deleted tenant cannot be changed (409
        `urn:maiak:problem:tenant-deleted`). Platform admins only.
      tags: [admin]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTenantUpdate"
      responses:
        "200":
          description: The tenant after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: adminDeleteTenant
      summary: Soft-delete a tenant
      description: |
        Marks the tenant deleted (and suspended). Nothing is erased: its data stays, its users
        cannot log in, its sessions stop working and nothing of it is checked or delivered any
        more. Deleting a deleted tenant changes nothing. The `default` tenant and a tenant the
        admin belongs to cannot be deleted (409 `urn:maiak:problem:protected-tenant`). Platform
        admins only.
      tags: [admin]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/tenants/{tenantId}/users:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      operationId: adminListTenantUsers
      summary: Users of a tenant
      description: The members of the tenant (deleted tenants included), oldest membership first. `query` matches the login. Platform admins only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/AdminQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: One page of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/users/{userId}/reset-password:
    parameters:
      - name: userId
        in: path
        required: true
        description: User id; a value that is not a UUID is answered with 400
        schema:
          type: string
          format: uuid
    post:
      operationId: adminResetUserPassword
      summary: Give a user a temporary password
      description: |
        Replaces the user's password with a random temporary password, deletes all of the user's
        sessions and writes an audit row (never with the password). The password is in this
        answer only (`Cache-Control: no-store`); hand it to the user over a trusted channel. The
        password of the system admin is managed by its Secret and cannot be reset here (409
        `urn:maiak:problem:system-admin`). Platform admins only.
      tags: [admin]
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The temporary password, shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporaryPassword"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: maiak_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    MonitorId:
      name: monitorId
      in: path
      required: true
      description: Monitor id; a value that is not a UUID is answered with 400
      schema:
        type: string
        format: uuid
    ChannelId:
      name: channelId
      in: path
      required: true
      description: Notification channel id; a value that is not a UUID is answered with 400
      schema:
        type: string
        format: uuid
    TenantId:
      name: tenantId
      in: path
      required: true
      description: Tenant id; a value that is not a UUID is answered with 400
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Project id; a value that is not a UUID is answered with 400
      schema:
        type: string
        format: uuid
    ProjectFilter:
      name: projectId
      in: query
      required: false
      description: Only this project; 404 when the caller does not see it
      schema:
        type: string
        format: uuid
    MemberUserId:
      name: userId
      in: path
      required: true
      description: User id of the member; a value that is not a UUID is answered with 400
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      description: Invitation id; a value that is not a UUID is answered with 400
      schema:
        type: string
        format: uuid
    AdminQuery:
      name: query
      in: query
      required: false
      description: Case-insensitive substring to search for; empty lists everything
      schema:
        type: string
        maxLength: 200
    Limit:
      name: limit
      in: query
      required: false
      description: Page size
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Offset:
      name: offset
      in: query
      required: false
      description: Number of items to skip
      schema:
        type: integer
        minimum: 0
        maximum: 1000000
        default: 0
    StatusPageId:
      name: statusPageId
      in: path
      required: true
      description: Status page id; a value that is not a UUID is answered with 400
      schema:
        type: string
        format: uuid
    OAuthProviderId:
      name: provider
      in: path
      required: true
      description: The OAuth provider
      schema:
        $ref: "#/components/schemas/OAuthProvider"
    AuthDomainId:
      name: domainId
      in: path
      required: true
      description: Sign-in domain id; a value that is not a UUID is answered with 400
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: The `csrf_token` of the session (from login or `GET /api/v1/auth/me`)
      schema:
        type: string
        minLength: 1
        maxLength: 256
  responses:
    BadRequest:
      description: The request does not match the contract
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Not logged in, or the credentials are invalid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Missing or invalid CSRF token, or not allowed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource does not exist in this tenant (or was deleted)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request conflicts with the current state (for example the monitor is not a heartbeat)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PlanLimitReached:
      description: |
        The tenant's plan does not allow one more of this resource: `type` is
        `urn:maiak:problem:plan-limit-reached`, with the extension members `limit` and `max`
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:maiak:problem:plan-limit-reached
            title: Plan limit reached
            status: 409
            detail: The Free plan allows at most 3 monitors.
            limit: monitors
            max: 3
    UnprocessableEntity:
      description: The request is well-formed but breaks a validation rule; see `fieldErrors`
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until a new attempt may succeed
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: A dependency of the operation is temporarily unavailable; retry later
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Error:
      description: Unexpected error (also 501 for operations that are not implemented yet)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, version, commit]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          example: 1a2b3c4
        commit:
          type: string
          example: 1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login:
          type: string
          description: An email address or the system login (the default admin is `admin`), case-insensitive
          minLength: 1
          maxLength: 254
          pattern: "^[A-Za-z0-9._@+-]+$"
          example: admin
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          description: Email address; the policy (see the operation) is checked by the server (422)
          minLength: 1
          maxLength: 1024
          example: owner@example.com
        password:
          type: string
          format: password
          description: 12-128 characters, not equal to the email; checked by the server (422)
          minLength: 1
          maxLength: 1024
        inviteToken:
          type: string
          format: password
          description: The token of an invitation link; join that organization instead of creating one
          minLength: 1
          maxLength: 128
    PublicConfig:
      type: object
      additionalProperties: false
      required: [registrationEnabled]
      properties:
        registrationEnabled:
          type: boolean
          description: Whether `POST /api/v1/auth/register` accepts registrations
    SessionInfo:
      type: object
      additionalProperties: false
      required: [user, tenant, role, csrf_token, expires_at]
      properties:
        user:
          $ref: "#/components/schemas/User"
        tenant:
          $ref: "#/components/schemas/Tenant"
        role:
          $ref: "#/components/schemas/MembershipRole"
        csrf_token:
          type: string
          description: Send as `X-CSRF-Token` on unsafe requests
        expires_at:
          type: string
          format: date-time
    User:
      type: object
      additionalProperties: false
      required: [id, login, display_name]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
          description: Lowercase login, the email address of a registered user (the default admin is `admin`)
          example: admin
        display_name:
          type: string
        isPlatformAdmin:
          type: boolean
          description: |
            Whether the user is the platform admin (only the system admin configured by
            `MAIAK_ADMIN_LOGIN`; no API grants it). Always present in answers of this version;
            camelCase like every field added after ADR-0017.
    Tenant:
      type: object
      additionalProperties: false
      required: [id, slug, name]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
    MembershipRole:
      type: string
      enum: [owner, admin, member, viewer]
    MonitorStatus:
      type: string
      description: Aggregated status. `unknown` until the first check after creation, resume or a URL change (for a heartbeat, until the first ping or the first missed deadline), and while the monitor is paused (`paused` is then true).
      enum: [unknown, up, down]
    MonitorType:
      type: string
      description: "`http`: an HTTPS check every minute. `heartbeat`: a watchdog that expects pings on its secret URL."
      enum: [http, heartbeat]
    HeartbeatToken:
      type: object
      additionalProperties: false
      required: [heartbeatUrl]
      properties:
        heartbeatUrl:
          type: string
          description: The secret ping URL; shown once, store it like a password
          example: https://maiak.klr-ops.net/api/v1/heartbeat/3q2-7wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    ExpectedStatus:
      type: string
      description: |
        `2xx` (any 200-299), or one exact HTTP status code from 200 to 299 or from 400 to 599, as a
        string. 1xx and 3xx cannot be observed (the client consumes 1xx and follows redirects) and
        are rejected.
      pattern: "^(2xx|2[0-9]{2}|[45][0-9]{2})$"
      example: 2xx
    MonitorCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        type:
          $ref: "#/components/schemas/MonitorType"
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: Website
        url:
          type: string
          description: Required for `http`. HTTPS URL on port 443, without credentials; hosts that are private IP literals or internal names are rejected
          minLength: 1
          maxLength: 2048
          example: https://example.com/health
        expectedIntervalSeconds:
          type: integer
          description: Heartbeat only. How often a ping is expected; 300 when omitted (no schema default, so http requests stay free of it)
          minimum: 60
          maximum: 86400
        graceSeconds:
          type: integer
          description: Heartbeat only. Extra time after the expected interval before the heartbeat is down; 60 when omitted
          minimum: 0
          maximum: 3600
        intervalSeconds:
          type: integer
          description: Check interval; only 60 is accepted in the MVP
          default: 60
        timeoutSeconds:
          type: integer
          description: Request deadline including redirects; only 10 is accepted in the MVP
          default: 10
        expectedStatus:
          $ref: "#/components/schemas/ExpectedStatus"
        failureThreshold:
          type: integer
          description: Consecutive failures before the monitor is down
          minimum: 1
          maximum: 3
          default: 2
        notifySlack:
          type: boolean
          default: true
        projectId:
          type: string
          format: uuid
          description: The monitor's project; the Default project when omitted
        channelIds:
          type: array
          description: The notification channels of the monitor (of its project or organization-wide); empty or omitted means the active channels of its project
          maxItems: 10
          items:
            type: string
            format: uuid
    MonitorUpdate:
      type: object
      additionalProperties: false
      description: Only the given fields change. `intervalSeconds` and `timeoutSeconds` are accepted only with their current value.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        url:
          type: string
          minLength: 1
          maxLength: 2048
        intervalSeconds:
          type: integer
        timeoutSeconds:
          type: integer
        expectedStatus:
          $ref: "#/components/schemas/ExpectedStatus"
        failureThreshold:
          type: integer
          minimum: 1
          maximum: 3
        notifySlack:
          type: boolean
        expectedIntervalSeconds:
          type: integer
          minimum: 60
          maximum: 86400
        graceSeconds:
          type: integer
          minimum: 0
          maximum: 3600
        projectId:
          type: string
          format: uuid
          description: Moves the monitor to this project
        channelIds:
          type: array
          description: The notification channels of the monitor; replaces the selection; an empty list means the active channels of the monitor's project
          maxItems: 10
          items:
            type: string
            format: uuid
    Incident:
      type: object
      additionalProperties: false
      required: [id, startedAt, resolvedAt, reason]
      properties:
        id:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          description: Why the monitor went down (the error kind of the failing checks, for example `timeout`, `unexpected_status` or `heartbeat_missed`)
    OngoingIncident:
      type: object
      nullable: true
      additionalProperties: false
      description: The open incident of a monitor; null when there is none
      required: [id, startedAt, reason]
      properties:
        id:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        reason:
          type: string
    MonitorListItem:
      type: object
      additionalProperties: false
      required:
        - id
        - projectId
        - type
        - name
        - url
        - intervalSeconds
        - timeoutSeconds
        - expectedStatus
        - failureThreshold
        - notifySlack
        - paused
        - status
        - statusSince
        - lastErrorKind
        - lastCheckedAt
        - tlsExpiresAt
        - ongoingIncident
        - lastPingAt
        - expectedIntervalSeconds
        - graceSeconds
        - uptime24h
        - lastResponseMs
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
          description: The project the monitor belongs to
        type:
          $ref: "#/components/schemas/MonitorType"
        name:
          type: string
        url:
          type: string
          description: The checked URL; empty for a heartbeat
        intervalSeconds:
          type: integer
        timeoutSeconds:
          type: integer
        expectedStatus:
          $ref: "#/components/schemas/ExpectedStatus"
        failureThreshold:
          type: integer
        notifySlack:
          type: boolean
        paused:
          type: boolean
        status:
          $ref: "#/components/schemas/MonitorStatus"
        statusSince:
          type: string
          format: date-time
          description: When the status last changed
        lastErrorKind:
          type: string
          nullable: true
          description: Error kind of the last failed check, null after a success
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true
        tlsExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: Expiry of the certificate seen by the last successful check
        ongoingIncident:
          $ref: "#/components/schemas/OngoingIncident"
        lastPingAt:
          type: string
          format: date-time
          nullable: true
          description: Heartbeat only. Time of the newest accepted ping; null before the first and for http monitors
        expectedIntervalSeconds:
          type: integer
          nullable: true
          description: Heartbeat only (null for http monitors)
        graceSeconds:
          type: integer
          nullable: true
          description: Heartbeat only (null for http monitors)
        uptime24h:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 100
          description: Percentage of successful checks in the last 24 h; null when no check ran
        lastResponseMs:
          type: integer
          nullable: true
          description: Response time of the last check in milliseconds; null when no check ran
    MonitorSummary:
      type: object
      additionalProperties: false
      required: [up, down, paused, unknown]
      description: Counts over all non-deleted monitors. A paused monitor counts only as paused.
      properties:
        up:
          type: integer
        down:
          type: integer
        paused:
          type: integer
        unknown:
          type: integer
    MonitorList:
      type: object
      additionalProperties: false
      required: [summary, items]
      properties:
        summary:
          $ref: "#/components/schemas/MonitorSummary"
        items:
          type: array
          items:
            $ref: "#/components/schemas/MonitorListItem"
    Uptime:
      type: object
      additionalProperties: false
      required: [h24, d7, d30]
      description: Percentage of successful checks per window; null when no check ran in it
      properties:
        h24:
          type: number
          format: double
          nullable: true
        d7:
          type: number
          format: double
          nullable: true
        d30:
          type: number
          format: double
          nullable: true
    MonitorDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - projectId
        - type
        - name
        - url
        - intervalSeconds
        - timeoutSeconds
        - expectedStatus
        - failureThreshold
        - notifySlack
        - paused
        - status
        - statusSince
        - lastErrorKind
        - lastCheckedAt
        - tlsExpiresAt
        - ongoingIncident
        - lastPingAt
        - expectedIntervalSeconds
        - graceSeconds
        - uptime
        - channelIds
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
          description: The project the monitor belongs to
        type:
          $ref: "#/components/schemas/MonitorType"
        name:
          type: string
        url:
          type: string
          description: The checked URL; empty for a heartbeat
        intervalSeconds:
          type: integer
        timeoutSeconds:
          type: integer
        expectedStatus:
          $ref: "#/components/schemas/ExpectedStatus"
        failureThreshold:
          type: integer
        notifySlack:
          type: boolean
        paused:
          type: boolean
        status:
          $ref: "#/components/schemas/MonitorStatus"
        statusSince:
          type: string
          format: date-time
        lastErrorKind:
          type: string
          nullable: true
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true
        tlsExpiresAt:
          type: string
          format: date-time
          nullable: true
        ongoingIncident:
          $ref: "#/components/schemas/OngoingIncident"
        lastPingAt:
          type: string
          format: date-time
          nullable: true
          description: Heartbeat only. Time of the newest accepted ping; null before the first and for http monitors
        expectedIntervalSeconds:
          type: integer
          nullable: true
          description: Heartbeat only (null for http monitors)
        graceSeconds:
          type: integer
          nullable: true
          description: Heartbeat only (null for http monitors)
        uptime:
          $ref: "#/components/schemas/Uptime"
        channelIds:
          type: array
          description: The selected notification channels; empty means the active channels of the monitor's project
          items:
            type: string
            format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        heartbeatUrl:
          type: string
          description: Only in the response that creates a heartbeat. The secret ping URL; it is not stored and cannot be shown again
    StatsRange:
      type: string
      enum: [24h, 7d, 30d]
      default: 24h
    LatencyPoint:
      type: object
      additionalProperties: false
      required: [t, avgMs, okRatio]
      properties:
        t:
          type: string
          format: date-time
          description: Start of the bucket (UTC)
        avgMs:
          type: number
          format: double
          nullable: true
          description: Average response time of the checks in the bucket that received a response (failed checks with an HTTP status included); null when none did
        okRatio:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 1
          description: Share of successful checks in the bucket; null when no check ran
    MonitorStats:
      type: object
      additionalProperties: false
      required: [range, avgMs, p95Ms, series]
      properties:
        range:
          $ref: "#/components/schemas/StatsRange"
        avgMs:
          type: number
          format: double
          nullable: true
          description: Average response time of the checks in the range that received a response (failed checks with an HTTP status included); null when none did
        p95Ms:
          type: number
          format: double
          nullable: true
        series:
          type: array
          items:
            $ref: "#/components/schemas/LatencyPoint"
    Check:
      type: object
      additionalProperties: false
      required: [checkedAt, location, ok, httpStatus, responseMs, errorKind]
      properties:
        checkedAt:
          type: string
          format: date-time
        location:
          type: string
          description: Code of the probe location
          example: home-eu-central-1
        ok:
          type: boolean
        httpStatus:
          type: integer
          nullable: true
        responseMs:
          type: integer
          nullable: true
        errorKind:
          type: string
          nullable: true
    CheckList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Check"
    IncidentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Incident"
    ChannelType:
      type: string
      description: "`slack_webhook`: a Slack Incoming Webhook"
      enum: [slack_webhook]
    ChannelEvent:
      type: string
      description: "`down`: a monitor went down (and reminders while it stays down); `recovered`: it is back up; `tls_expiring`: its TLS certificate expires within 14 days"
      enum: [down, recovered, tls_expiring]
    ChannelEvents:
      type: array
      minItems: 1
      maxItems: 3
      uniqueItems: true
      items:
        $ref: "#/components/schemas/ChannelEvent"
    ChannelMention:
      type: array
      description: Slack mentions put in front of `down` and reminder messages; each is `@here`, `@channel`, `<!subteam^ID>` or `<@UID>` (400 otherwise)
      maxItems: 3
      items:
        type: string
        maxLength: 32
        pattern: "^(@here|@channel|<!subteam\\^[A-Z0-9]{2,20}>|<@[UW][A-Z0-9]{2,20}>)$"
      example: ["@here"]
    ReminderMinutes:
      type: integer
      description: 0 for no reminders, otherwise 5 to 1440 minutes between reminders while an incident stays open (1 to 4 is answered with 422)
      minimum: 0
      maximum: 1440
    Channel:
      type: object
      additionalProperties: false
      required: [id, projectId, name, type, events, mention, reminderMinutes, status, createdAt, updatedAt]
      description: A notification channel. Its webhook URL is a secret and is never returned.
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
          nullable: true
          description: The project of the channel; null for an organization-wide channel, which every project's monitors may select
        name:
          type: string
          example: "#ops-alerts"
        type:
          $ref: "#/components/schemas/ChannelType"
        events:
          $ref: "#/components/schemas/ChannelEvents"
        mention:
          $ref: "#/components/schemas/ChannelMention"
        reminderMinutes:
          $ref: "#/components/schemas/ReminderMinutes"
        status:
          type: string
          enum: [active, failed]
          description: "`failed` means Slack answered 404 or 410 (the webhook was revoked); nothing is sent until a new webhook URL is stored."
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ChannelList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
    ChannelCreate:
      type: object
      additionalProperties: false
      required: [name, webhookUrl]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          example: "#ops-alerts"
        type:
          $ref: "#/components/schemas/ChannelType"
        projectId:
          type: string
          format: uuid
          description: The channel's project; the Default project when omitted
        organizationWide:
          type: boolean
          description: "`true` creates an organization-wide channel; not together with `projectId`"
        webhookUrl:
          type: string
          format: password
          description: Slack Incoming Webhook URL, `https://hooks.slack.com/services/...`; write-only
          minLength: 1
          maxLength: 2048
        events:
          $ref: "#/components/schemas/ChannelEvents"
        mention:
          $ref: "#/components/schemas/ChannelMention"
        reminderMinutes:
          $ref: "#/components/schemas/ReminderMinutes"
    ChannelUpdate:
      type: object
      additionalProperties: false
      description: Only the given fields change.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        projectId:
          type: string
          format: uuid
          description: Moves the channel to this project
        organizationWide:
          type: boolean
          description: "`true` makes the channel organization-wide; not together with `projectId`; `false` changes nothing"
        webhookUrl:
          type: string
          format: password
          description: A new Slack Incoming Webhook URL; write-only
          minLength: 1
          maxLength: 2048
        events:
          $ref: "#/components/schemas/ChannelEvents"
        mention:
          $ref: "#/components/schemas/ChannelMention"
        reminderMinutes:
          $ref: "#/components/schemas/ReminderMinutes"
    Usage:
      type: object
      additionalProperties: false
      required: [plan, limits, usage]
      properties:
        plan:
          $ref: "#/components/schemas/PlanRef"
        limits:
          $ref: "#/components/schemas/ResourceCounts"
        usage:
          $ref: "#/components/schemas/ResourceCounts"
    PlanRef:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key:
          type: string
          example: free
        name:
          type: string
          example: Free
    ResourceCounts:
      type: object
      additionalProperties: false
      required: [monitors, heartbeats, channels, members, projects, statusPages]
      properties:
        monitors:
          type: integer
          minimum: 0
          description: HTTPS monitors
        heartbeats:
          type: integer
          minimum: 0
          description: Heartbeat (watchdog) monitors
        channels:
          type: integer
          minimum: 0
          description: Notification channels (deleted channels do not count)
        members:
          type: integer
          minimum: 0
          description: Members plus open invitations (an open invitation reserves a place)
        projects:
          type: integer
          minimum: 0
          description: Projects (deleted projects do not count); the Default project counts
        statusPages:
          type: integer
          minimum: 0
          description: Status pages (deleted pages do not count)
    TenantStatus:
      type: string
      description: "`suspended`: the tenant's users cannot log in and nothing of it is checked. A deleted tenant is also `suspended` and has `deletedAt`."
      enum: [active, suspended]
    AdminTenant:
      type: object
      additionalProperties: false
      required: [id, slug, name, planKey, planName, status, createdAt, deletedAt, users, monitors, heartbeats]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        planKey:
          type: string
          example: free
        planName:
          type: string
          example: Free
        status:
          $ref: "#/components/schemas/TenantStatus"
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Set when the tenant is soft-deleted
        users:
          type: integer
          minimum: 0
          description: Members of the tenant
        monitors:
          type: integer
          minimum: 0
          description: HTTPS monitors that are not deleted (paused ones included)
        heartbeats:
          type: integer
          minimum: 0
          description: Heartbeat monitors that are not deleted (paused ones included)
    AdminTenantList:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminTenant"
        total:
          type: integer
          minimum: 0
          description: Number of all matching tenants
        limit:
          type: integer
        offset:
          type: integer
    AdminTenantUpdate:
      type: object
      additionalProperties: false
      description: At least one field; the status is checked by the server (422 for anything but `active` or `suspended`)
      properties:
        planKey:
          type: string
          minLength: 1
          maxLength: 64
          example: internal
        status:
          type: string
          maxLength: 32
          description: "`active` or `suspended`"
          example: suspended
    AdminUser:
      type: object
