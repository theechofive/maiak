# Included in every location that sets its own add_header (nginx does not inherit add_header then).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
# style-src keeps 'unsafe-inline' as a precaution for inline style attributes; it is probably removable (L-053);
# scripts stay 'self' only. The API is same-origin, so connect-src is 'self'.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
