# Included in every location that sets its own add_header (nginx does not inherit add_header then).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
# style-src 'self' only (L-053): React sets the few computed styles (bar heights) through the CSSOM,
# which CSP does not restrict; the build has no inline <style> or style attributes in its HTML.
# scripts stay 'self' only. The API is same-origin, so connect-src is 'self'.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
