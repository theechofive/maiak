name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  # Path of the OpenAPI contract (adjust if the api/ layout differs).
  OPENAPI_SPEC: api/openapi.yaml

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4 # TODO(L-019) pin to SHA
        with:
          persist-credentials: false
      - name: Open items reference the ledger
        run: bash scripts/check-todos.sh
      - name: Migration file naming
        run: |
          set -euo pipefail
          dir=backend/migrations
          if [ ! -d "$dir" ]; then
            echo "No ${dir}; skipping."
            exit 0
          fi
          fail=0
          shopt -s nullglob
          for f in "$dir"/*.sql; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            if ! [[ "$base" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "::error file=${f}::migration name must be <14-digit timestamp>_<snake_case>.sql"
              fail=1
              continue
            fi
            if grep -q '+goose Down' "$f"; then
              echo "::error file=${f}::migrations are forward-only: remove '+goose Down'"
              fail=1
            fi
          done
          dups=$(find "$dir" -maxdepth 1 -type f -name '*.sql' -exec basename {} \; | cut -c1-14 | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "::error::duplicate migration timestamps: ${dups}"
            fail=1
          fi
          exit "$fail"

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' }}
      api: ${{ github.event_name != 'pull_request' || steps.filter.outputs.api == 'true' }}
      helm: ${{ github.event_name != 'pull_request' || steps.filter.outputs.helm == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@v4 # TODO(L-019) pin to SHA
        with:
          persist-credentials: false
      # On push to main everything runs: the "before" commit can be unreachable after a force push,
      # which makes paths-filter fail with git exit 128.
      - uses: dorny/paths-filter@v3 # TODO(L-019) pin to SHA
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'api/**'
              - 'sqlc.yaml'
              - 'Dockerfile'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            api:
              - 'api/**'
              - '.github/spectral.yaml'
              - '.github/workflows/ci.yml'
            helm:
              - 'deploy/helm/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database; credentials are not secrets.
      # SUPERUSER on a scratch Postgres: integration tests create and drop their own databases/roles.
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4 # TODO(L-019) pin to SHA
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5 # TODO(L-019) pin to SHA
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Generated code is up to date
        run: make check-generated
      # Deviation from `make lint`: the action installs golangci-lint (with its cache) and runs it
      # in backend/. Keep flags in sync with the Makefile `lint` target.
      - uses: golangci/golangci-lint-action@v8 # TODO(L-019) pin to SHA
        with:
          version: latest # TODO(L-019) pin golangci-lint version
          working-directory: backend
      - name: Test
        run: make test

  api-contract:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4 # TODO(L-019) pin to SHA
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint OpenAPI (spectral)
        run: npx --yes @stoplight/spectral-cli@6.11.1 lint "$OPENAPI_SPEC" --ruleset .github/spectral.yaml --fail-severity warn
      - uses: actions/setup-go@v5 # TODO(L-019) pin to SHA
        if: github.event_name == 'pull_request'
        with:
          go-version: stable
          cache: false
      - name: Breaking-change check (oasdiff vs base branch)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "origin/${BASE_REF}:${OPENAPI_SPEC}" 2>/dev/null; then
            echo "No ${OPENAPI_SPEC} on base branch; skipping breaking-change check."
            exit 0
          fi
          git show "origin/${BASE_REF}:${OPENAPI_SPEC}" > "${RUNNER_TEMP}/base-openapi.yaml"
          go install github.com/oasdiff/oasdiff@latest # TODO(L-019) pin oasdiff version
          "$(go env GOPATH)/bin/oasdiff" breaking "${RUNNER_TEMP}/base-openapi.yaml" "$OPENAPI_SPEC" --fail-on ERR

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4 # TODO(L-019) pin to SHA
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4 # TODO(L-019) pin to SHA
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  helm:
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4 # TODO(L-019) pin to SHA
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v4 # TODO(L-019) pin to SHA
      - name: Lint
        run: |
          helm lint deploy/helm/maiak
          helm lint deploy/helm/maiak -f deploy/helm/maiak/values-platform.yaml
          helm lint deploy/helm/maiak -f deploy/helm/maiak/values-platform.yaml --set web.enabled=true
          helm lint deploy/helm/maiak -f deploy/helm/maiak/values-platform.yaml --set dbBootstrap.enabled=false
      - name: Template
        run: |
          helm template maiak deploy/helm/maiak -n maiak -f deploy/helm/maiak/values-platform.yaml > /dev/null
          helm template maiak deploy/helm/maiak -n maiak -f deploy/helm/maiak/values-platform.yaml --set web.enabled=true > /dev/null
          helm template maiak deploy/helm/maiak -n maiak -f deploy/helm/maiak/values-platform.yaml --set dbBootstrap.enabled=false > /dev/null
