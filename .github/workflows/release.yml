name: release

# Builds and pushes the multi-arch backend and web images (tag: short SHA, plus `main`), then bumps
# image.tag / web.image.tag in values-platform.yaml with scripts/bump-image-tag.sh.
# `paths` (not paths-ignore) is used: GitHub does not allow both on one event. deploy/** and scripts/**
# are not listed, so the bump commit cannot re-trigger this workflow; it also carries [skip ci], and a
# push made with GITHUB_TOKEN does not start workflows anyway.
# Never executed yet: see ledger L-102 and R-010 for the first-run caveats.
on:
  push:
    branches: [main]
    paths:
      - backend/**
      - api/**
      - Dockerfile
      - web/**
  workflow_dispatch:

# Serialise releases; never cancel a run that is pushing an image / bump.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: ghcr.io/theechofive/maiak-backend

jobs:
  backend-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4 # TODO(L-019) pin to SHA
      - name: Compute short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3 # TODO(L-019) pin to SHA
      - uses: docker/setup-buildx-action@v4 # TODO(L-019) pin to SHA
      - uses: docker/login-action@v4 # TODO(L-019) pin to SHA
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7 # TODO(L-019) pin to SHA
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha }}
            ${{ env.IMAGE }}:main
          # Links the package to this repository so GITHUB_TOKEN may push it (L-102).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            VERSION=${{ steps.vars.outputs.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      WEB_IMAGE: ghcr.io/theechofive/maiak-web
    steps:
      - uses: actions/checkout@v4 # TODO(L-019) pin to SHA
      - name: Compute short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3 # TODO(L-019) pin to SHA
      - uses: docker/setup-buildx-action@v4 # TODO(L-019) pin to SHA
      - uses: docker/login-action@v4 # TODO(L-019) pin to SHA
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7 # TODO(L-019) pin to SHA
        with:
          context: web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.vars.outputs.sha }}
            ${{ env.WEB_IMAGE }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # The two bump jobs edit different keys of the same file and both push to main. They share one
  # concurrency group, so they never run at the same time; the script also retries a push that
  # lost a race against anything else (a human commit, for example). The group name differs from the
  # workflow-level `release` group on purpose: the same name would make the job wait for its own run.
  bump-backend:
    needs: backend-image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-bump
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # Credentials stay persisted on purpose: the script pushes with them.
      - uses: actions/checkout@v4 # TODO(L-019) pin to SHA
      - name: Bump image.tag in values-platform.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/bump-image-tag.sh backend "${GITHUB_SHA::7}"

  bump-web:
    needs: web-image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-bump
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4 # TODO(L-019) pin to SHA
      - name: Bump web.image.tag in values-platform.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/bump-image-tag.sh web "${GITHUB_SHA::7}"
