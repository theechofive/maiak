{{- if include "maiak.secrets.generate" . }}
{{- /* Secrets bootstrap (ADR-0091): creates maiak-admin(+ -initial) and maiak-crypto when absent.
       Waves: -4 RBAC, -3 Job. It holds no database credentials and stays enabled: it only ever
       creates missing Secrets and never overwrites one. */}}
{{- $s := .Values.secrets }}
{{- $b := $s.bootstrap }}
{{- $name := include "maiak.componentName" (dict "ctx" . "component" "secrets-bootstrap") }}
{{- $sel := dict "ctx" . "component" "secrets-bootstrap" }}
{{- $admin := include "maiak.secret.admin" . }}
{{- $initial := include "maiak.secret.adminInitial" . }}
{{- $crypto := include "maiak.secret.crypto" . }}
---
# Mounts an API token: the Job creates Secrets through the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "maiak.labels" $sel | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-4"
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "maiak.labels" $sel | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-4"
rules:
  # `create` cannot be restricted by resourceNames (the name is unknown to the authorizer on create).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $admin | quote }}, {{ $initial | quote }}, {{ $crypto | quote }}]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "maiak.labels" $sel | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-4"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "maiak.labels" $sel | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-3"
spec:
  backoffLimit: {{ $b.backoffLimit }}
  activeDeadlineSeconds: {{ $b.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ $b.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "maiak.labels" $sel | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: secrets-bootstrap
          image: {{ include "maiak.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml $b.command | nindent 12 }}
          env:
            - name: MAIAK_ENV
              value: {{ .Values.config.env | quote }}
            - name: MAIAK_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: MAIAK_SECRETS_ADMIN_MODE
              value: {{ ternary "generate" "skip" (eq $s.admin.source "generate") | quote }}
            - name: MAIAK_SECRETS_CRYPTO_MODE
              value: {{ ternary "generate" "skip" (eq $s.crypto.source "generate") | quote }}
            {{- if eq $s.admin.source "generate" }}
            - name: MAIAK_SECRETS_ADMIN_LOGIN
              value: {{ required "secrets.admin.login is required when secrets.admin.source=generate (the system admin login, e.g. admin)" $s.admin.login | quote }}
            {{- end }}
            - name: MAIAK_SECRETS_ADMIN_SECRET_NAME
              value: {{ $admin | quote }}
            - name: MAIAK_SECRETS_ADMIN_INITIAL_SECRET_NAME
              value: {{ $initial | quote }}
            - name: MAIAK_SECRETS_CRYPTO_SECRET_NAME
              value: {{ $crypto | quote }}
            - name: MAIAK_SECRETS_CRYPTO_KEY_ID
              value: {{ $s.crypto.keyId | quote }}
          resources:
            {{- toYaml $b.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- include "maiak.scheduling" $sel | nindent 6 }}
{{- end }}
