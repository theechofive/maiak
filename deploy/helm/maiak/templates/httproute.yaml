{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "maiak.fullname" . }}
  labels:
    {{- include "maiak.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.httpRoute.parentRef.name }}
      namespace: {{ .Values.httpRoute.parentRef.namespace }}
      sectionName: {{ .Values.httpRoute.parentRef.sectionName }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httpRoute.apiPathPrefix }}
      timeouts:
        request: {{ .Values.httpRoute.apiRequestTimeout }}
      backendRefs:
        - name: {{ include "maiak.componentName" (dict "ctx" . "component" "api") }}
          port: {{ .Values.api.service.port }}
    {{- /* Catch-all only when the frontend is deployed; otherwise unmatched paths 404 at the gateway. */}}
    {{- if .Values.web.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "maiak.componentName" (dict "ctx" . "component" "web") }}
          port: {{ .Values.web.service.port }}
    {{- end }}
{{- end }}
