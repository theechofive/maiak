{{- if .Values.externalSecrets.enabled }}
{{- /* Wave -1 so secrets exist before workloads (and before a Sync-phase migration hook). */}}
{{- $es := .Values.externalSecrets }}
{{- $items := list
  (dict "name" (include "maiak.secret.db" .) "key" $es.db.remoteKey "props" (list "api_url" "worker_url" "owner_url"))
  (dict "name" (include "maiak.secret.admin" .) "key" $es.admin.remoteKey "props" (list "email" "password_hash"))
  (dict "name" (include "maiak.secret.crypto" .) "key" $es.crypto.remoteKey "props" (list "keys" "active_key_id"))
}}
{{- range $item := $items }}
---
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $item.name }}
  labels:
    {{- include "maiak.labels" (dict "ctx" $ "component" "secrets") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name }}
  target:
    name: {{ $item.name }}
    creationPolicy: {{ $es.creationPolicy }}
  data:
    {{- range $p := $item.props }}
    - secretKey: {{ $p }}
      remoteRef:
        key: {{ $item.key }}
        property: {{ $p }}
    {{- end }}
{{- end }}
{{- end }}
