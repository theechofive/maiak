{{- if .Values.externalSecrets.enabled }}
{{- /* Wave -2: secrets exist before the migration hook (wave -1) and before workloads (wave 0).
       Only the Secrets whose secrets.<name>.source is externalSecret are rendered; with source
       generate the secrets bootstrap Job (wave -3, ADR-0091) creates them instead.
       The maiak-db Secret is NOT rendered here: the db bootstrap Job (wave -3) creates it at runtime. */}}
{{- $es := .Values.externalSecrets }}
{{- $s := .Values.secrets }}
{{- $items := list }}
{{- if eq $s.admin.source "externalSecret" }}
{{- $items = append $items (dict "name" (include "maiak.secret.admin" .) "key" $s.admin.remoteKey "props" (list "email" "password_hash")) }}
{{- end }}
{{- if eq $s.crypto.source "externalSecret" }}
{{- $items = append $items (dict "name" (include "maiak.secret.crypto" .) "key" $s.crypto.remoteKey "props" (list "keys" "active_key_id")) }}
{{- end }}
{{- range $item := $items }}
---
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $item.name }}
  labels:
    {{- include "maiak.labels" (dict "ctx" $ "component" "secrets") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name }}
  target:
    name: {{ $item.name }}
    creationPolicy: {{ $es.creationPolicy }}
  data:
    {{- range $p := $item.props }}
    - secretKey: {{ $p }}
      remoteRef:
        key: {{ required (printf "secrets remoteKey is required for %s with source externalSecret" $item.name) $item.key }}
        property: {{ $p }}
    {{- end }}
{{- end }}
{{- end }}
