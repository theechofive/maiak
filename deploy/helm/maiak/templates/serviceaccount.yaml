{{- /* One ServiceAccount per workload; no API token is mounted (automountServiceAccountToken: false). */ -}}
{{- $components := list "api" "worker" "jobs" }}
{{- if .Values.web.enabled }}{{ $components = append $components "web" }}{{ end }}
{{- range $c := $components }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "maiak.componentName" (dict "ctx" $ "component" $c) }}
  labels:
    {{- include "maiak.labels" (dict "ctx" $ "component" $c) | nindent 4 }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
---
# Migration ServiceAccount. PreSync mode: it must exist before the hook Job, so it is a hook too.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "maiak.componentName" (dict "ctx" . "component" "migrate") }}
  labels:
    {{- include "maiak.labels" (dict "ctx" . "component" "migrate") | nindent 4 }}
  annotations:
    {{- if eq .Values.migration.hookPhase "PreSync" }}
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
    {{- else }}
    argocd.argoproj.io/sync-wave: "-1"
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
