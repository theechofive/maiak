# Overrides for the klr-platform cluster (EKS arm64, ArgoCD, Envoy Gateway internal).
# The ArgoCD Application that uses this file is argocd-application.yaml next to it.

image:
  # CI-MANAGED: rewritten by .github/workflows/release.yml on every backend image build.
  # Do not edit by hand and keep this key at exactly `image.tag` (2-space indent, double quotes).
  tag: "d92d775"

config:
  publicUrl: https://maiak.klr-ops.net
  # Self-service registration off (owner decision, O-07; R-130). Turned on for ONE sync only to
  # create the company organization with the owner's personal account (docs/runbooks/first-install.md).
  registrationEnabled: false

httpRoute:
  hostnames:
    - maiak.klr-ops.net
  parentRef:
    name: envoy-gateway-internal
    namespace: envoy-gateway
    sectionName: https

web:
  enabled: true
  image:
    # CI-MANAGED: rewritten by .github/workflows/release.yml (web-image job). Keep this key at
    # exactly `web.image.tag` (4-space indent, double quotes).
    tag: "39e3d3f"

# Admin login and encryption key (ADR-0091): generated in the cluster on the first sync. Log in as `admin` with
# the one-time password from the Secret maiak-admin-initial, then delete that Secret
# (docs/runbooks/first-deploy.md). Switch a source to externalSecret to read it from AWS Secrets Manager instead.
secrets:
  admin:
    source: generate
    login: admin
  crypto:
    source: generate

# First deploy created the database, roles and the `maiak-db` Secret (ADR-0014); switched off after the
# first successful sync (the Secret persists). Set `enabled: true` only for a new database or environment:
# while enabled the Job holds the RDS master login, which is Grafana's own login (risk R-009, L-009).
dbBootstrap:
  enabled: false
  host: grafana.czqsaiesae4n.eu-central-1.rds.amazonaws.com

# Status page renderer (P-05, ADR-0103): off until the `maiak-db` Secret has `statuspage_url`. It is
# added by a run of the db bootstrap, which also creates the maiak_statuspage role (L-292). Set this
# to true in the SAME commit as dbBootstrap.enabled: true (safe on an empty and on an existing
# database: the bootstrap runs in an earlier wave), then switch only the bootstrap off
# (docs/runbooks/first-install.md, status-page.md). The admin API and the settings page work without it.
statuspage:
  enabled: false
