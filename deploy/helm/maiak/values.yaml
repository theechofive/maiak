# Generic defaults. Cluster-specific overrides live in values-platform.yaml.

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/theechofive/maiak-backend
  # Empty -> Chart.appVersion. In values-platform.yaml this is CI-managed.
  tag: ""
  pullPolicy: IfNotPresent

# TODO(L-002): ghcr pull-secret decision is OPEN and blocks the first deploy.
# The `theechofive` packages may be private. Once decided, list the secret names here,
# e.g. [{name: ghcr-pull}].
imagePullSecrets: []

# Application configuration (env contract read by the backend).
config:
  env: production
  logLevel: info
  adminPort: 9090          # MAIAK_ADMIN_ADDR (health + metrics), shared by api/worker/jobs
  sessionTTL: 24h          # MAIAK_SESSION_TTL (api only)
  cookieSecure: true       # MAIAK_COOKIE_SECURE (api only)
  trustedProxyHops: 1      # MAIAK_TRUSTED_PROXY_HOPS (api only); 1 = Envoy Gateway
  # MAIAK_PUBLIC_URL (api and jobs, required): https URL without trailing slash, linked from Slack messages.
  publicUrl: https://maiak.klr-ops.net
  # MAIAK_BLOCKED_CIDRS (api, worker, jobs): extra ranges for the SSRF guard on top of its built-in
  # private/link-local/metadata ranges (ADR-0011, ADR-0016). Add the VPC and service CIDRs of the
  # cluster (L-100), because NetworkPolicy is not enforced (R-002).
  blockedCIDRs: []

# Admin login and encryption keys (ADR-0091). Workloads always read the Secrets `<fullname>-admin`
# (login, password_hash) and `<fullname>-crypto` (keys, active_key_id). Per Secret, `source` picks
# who creates it:
#   generate        (default) the secrets bootstrap hook Job creates it in the cluster if absent and
#                   never overwrites it. The admin password is generated and readable ONCE from the
#                   Secret `<fullname>-admin-initial` (delete it after the first login). A generated
#                   key exists only in the cluster: losing the namespace loses it (it only encrypts the
#                   Slack webhook URLs, which can be re-entered).
#   externalSecret  an ExternalSecret reads it from AWS Secrets Manager (`remoteKey`, wave -2).
secrets:
  admin:
    source: generate
    # System admin login (generate mode), 1-64 of [a-z0-9._@-]; the app treats logins case-insensitively.
    login: admin
    # externalSecret mode: JSON secret with properties login, password_hash
    remoteKey: platform/maiak/admin
  crypto:
    source: generate
    # Key id of the generated key (generate mode); MAIAK_ENCRYPTION_ACTIVE_KEY_ID.
    keyId: k1
    # externalSecret mode: JSON secret with properties keys (JSON string), active_key_id
    remoteKey: platform/maiak/crypto
  # The hook Job (ArgoCD Sync, wave -3) rendered when any source is generate. It has no database
  # credentials; its Role can only create Secrets and read/update the three Secrets above.
  bootstrap:
    command: ["/app/maiakctl", "secrets", "bootstrap"]
    backoffLimit: 2
    activeDeadlineSeconds: 300
    ttlSecondsAfterFinished: 600
    # argon2id hashing uses 64 MiB (the `maiakctl hashpw` default).
    resources:
      requests: {cpu: 50m, memory: 96Mi}
      limits: {cpu: 500m, memory: 256Mi}

# External Secrets Operator settings (AWS Secrets Manager), used by the db bootstrap admin
# ExternalSecret and by every `secrets.*.source: externalSecret` (wave -2).
externalSecrets:
  enabled: true
  apiVersion: external-secrets.io/v1
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets
  refreshInterval: "0"
  creationPolicy: Owner
  # No `db` entry: the Secret `maiak-db` (api_url, worker_url, owner_url, owner_password,
  # api_password, worker_password) is created at runtime by the dbBootstrap Job and is not
  # managed by ArgoCD/Helm (ADR-0014). With dbBootstrap.enabled=false it must already exist.
  # The admin/crypto remote keys moved to secrets.admin.remoteKey / secrets.crypto.remoteKey.

podAnnotations: {}
podLabels: {}

# Applied to all pods. Nodes are labelled workload-type=general without taints, so none are set by default.
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

strategy:
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

revisionHistoryLimit: 3
terminationGracePeriodSeconds: 30

serviceAccount:
  annotations: {}

api:
  replicas: 2
  command: ["/app/api"]
  # Key in Secret <fullname>-db used for MAIAK_DATABASE_URL.
  databaseUrlKey: api_url
  httpPort: 8080
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {cpu: 500m, memory: 384Mi}
  env: []                  # extra env vars (list of EnvVar)
  service:
    port: 8080
  pdb:
    enabled: false
    minAvailable: 1

worker:
  # SECURITY: the worker must NEVER run with hostNetwork. The IMDS hop-limit protection
  # (IMDSv2 hop limit 1) assumes pod traffic cannot reach the node metadata endpoint, and
  # the worker executes tenant-supplied monitor targets (SSRF surface). hostNetwork is
  # deliberately not templated for any workload.
  replicas: 2
  command: ["/app/worker"]
  databaseUrlKey: worker_url
  # ADR-0022: up to 25 s for in-flight checks plus a 15 s bounded final flush.
  terminationGracePeriodSeconds: 45
  # MAIAK_WORKER_* (config.Worker, defaults mirrored from the code).
  claimBatch: 100
  concurrency: 50
  tenantConcurrency: 5
  hostConcurrency: 2
  # MAIAK_WORKER_LOCATION: probe_locations code whose checks this worker runs (a DNS label).
  location: home-eu-central-1
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {cpu: 500m, memory: 384Mi}
  env: []

jobs:
  replicas: 1
  command: ["/app/jobs"]
  # Least privilege (worker role): jobs claims through the SECURITY DEFINER functions (ADR-0051).
  databaseUrlKey: worker_url
  # ADR-0051: up to 25 s for sends in flight on SIGTERM, then the lease expires.
  terminationGracePeriodSeconds: 45
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  env: []

# Memory limits are 3-4x the requests everywhere; requests stay small because klr-platform is
# memory-tight (R-003). Total requests with the platform replicas: 2x96 + 2x96 + 64 + 2x32 = 512Mi.

# Frontend (React, nginx static). Enabled per environment in values-platform.yaml.
web:
  enabled: false
  replicas: 2
  image:
    repository: ghcr.io/theechofive/maiak-web
    tag: ""                # empty -> falls back to image.tag
  port: 8080
  service:
    port: 8080
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}
  env: []

# Automatic database bootstrap (ADR-0014): ArgoCD Sync hook Job running `/app/maiakctl db bootstrap`
# BEFORE the migration Job. Creates database + roles (idempotent) and the Secret `secretName`
# (api_url, worker_url, owner_url, owner_password, api_password, worker_password).
# SECURITY TRADE-OFF (risk R-009): while enabled, the Job holds the RDS master login, which is
# Grafana's own login on the shared instance (R-001). Set `enabled: false` after the first
# successful deploy (the Secret persists), or move to a dedicated RDS (L-009).
dbBootstrap:
  enabled: false
  host: ""                 # RDS endpoint, required when enabled (no default)
  port: 5432
  dbName: maiak
  sslmode: require
  # Created by the Job, NOT managed by Helm/ArgoCD. Workloads and the migrate Job read it.
  secretName: maiak-db
  # Master login read via ExternalSecret `<secretName>-admin` (hook, deleted after success).
  adminSecret:
    remoteKey: platform/grafana/db
    properties:
      username: username
      password: password
  command: ["/app/maiakctl", "db", "bootstrap"]
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 200m, memory: 128Mi}

# Database migration (ArgoCD hook running /app/migrate).
migration:
  # Sync (default) | PreSync.
  # Sync: ordering by waves: -4 admin ExternalSecret + bootstrap RBAC, -3 bootstrap Jobs (db, secrets),
  # -2 other ExternalSecrets + migrate ServiceAccount, -1 migrate Job, 0 workloads; so the very
  # first sync works. PreSync would run the Job before the ExternalSecrets exist on a first sync
  # and before the bootstrap Job (rejected at render time when dbBootstrap.enabled=true).
  hookPhase: Sync
  command: ["/app/migrate"]
  # Key in Secret <fullname>-db used for MAIAK_MIGRATE_DATABASE_URL.
  databaseUrlKey: owner_url
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

# Gateway API routing (NO Ingress objects).
httpRoute:
  enabled: true
  hostnames:
    - maiak.klr-ops.net
  parentRef:
    name: envoy-gateway-internal
    namespace: envoy-gateway
    sectionName: https
  apiPathPrefix: /api
  apiRequestTimeout: 60s

# --- Optional resources, all disabled by default ---

# NetworkPolicy (ingress only). WARNING (risk R-002): the klr-platform CNI does NOT enforce
# NetworkPolicy today, so enabling this gives no real protection until that changes.
networkPolicy:
  enabled: false
  gatewayNamespace: envoy-gateway      # namespace of the Envoy proxies allowed to reach api/web
  monitoringNamespace: monitoring      # namespace allowed to scrape the admin port

# ServiceMonitor for api/worker/jobs admin port /metrics (ledger L-003: Prometheus Operator CRDs
# availability / scrape setup undecided). Also creates one metrics Service per component.
serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics
  labels: {}

# Spread api/worker replicas across a topology key.
topologySpread:
  enabled: false
  topologyKey: kubernetes.io/hostname
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway
